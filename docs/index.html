typology"},coolingWPerM2:{value:"40–70 by region",unit:"W/m²",source:"ACCA Manual J / CIBSE Guide A / NCC 2022"},heatingWPerM2:{value:"30–70 by region",unit:"W/m²",source:"CSA F280 / Part L 2021 / NZBC H1"}},references:["ASHRAE Handbook — HVAC Systems and Equipment, Ch. 1","CIBSE Guide B"]},{id:"MEC-02",name:"Short Ducts from a Central Hall",discipline:"mechanical",problem:"Ductwork that wanders around a dwelling to reach the far corners loses heat, leaks air, whistles, and forces dropped ceilings in rooms where people notice them. Long branches also unbalance: the room at the end of the run is always the cold one.",solution:"Put the air handler in a closet or the hall ceiling at the dwelling's centre of gravity, run one flat rectangular trunk along the hall ceiling, and take a short round branch off it into each habitable room, stopping at the room edge nearest the hall. No supply run exceeds 12 m of developed length, and no duct crosses a bedroom.",parameters:{maxRunLength:{value:12,unit:"m",source:"default (ACCA Manual D friction-rate practice)"},trunkDepth:{value:.25,unit:"m",source:"default (fits a 300 mm hall bulkhead)"},trunkVelocity:{value:5,unit:"m/s",source:"ASHRAE Handbook — Fundamentals Ch. 21 (residential trunk)"},branchVelocity:{value:4,unit:"m/s",source:"ASHRAE Handbook — Fundamentals Ch. 21 (residential branch)"},branchDiameter:{value:"0.10–0.25",unit:"m",source:"default ladder"}},dependsOn:["ARC-01"],references:["ACCA Manual D","ASHRAE Handbook — Fundamentals Ch. 21"]},{id:"MEC-03",name:"Exhaust Rises in the Wet Wall",discipline:"mechanical",problem:"Bathroom and kitchen extract ducts that find their own way to a facade puncture the envelope once per room per floor, cross other dwellings, and cannot be balanced or fire-stopped economically.",solution:"Every extract grille runs the shortest path to the dwelling's wet wall, joins the other wet rooms above the ceiling, and rises in the nearest shared shaft to a roof fan. Kitchen extract keeps its own duct and its own riser all the way to the roof; general extract and dryer extract share one riser. Houses, which have no shaft, discharge horizontally through the nearest exterior wall instead.",parameters:{bathroomExtract:{value:25,unit:"l/s",source:"code:Approved Document F 2021 Table 1.2 (intermittent)"},wcExtract:{value:13,unit:"l/s",source:"code:Approved Document F 2021 Table 1.2"},kitchenExtract:{value:50,unit:"l/s",source:"code:ADF Table 1.2 / ASHRAE 62.2 Table 5.1 (100 cfm)"},extractDuctDiameter:{value:"0.10–0.15",unit:"m",source:"default"},maxDistanceToShaft:{value:12,unit:"m routed",source:"default (beyond this, discharge through the facade instead — towers excepted)"},separateKitchenRiser:{value:!0,source:"code:IMC 2021 §506.3 (independent kitchen exhaust)"}},dependsOn:["XD-01","XD-04"],references:["Approved Document F 2021","ASHRAE 62.2-2019 §5","IMC 2021 §506"]},{id:"MEC-04",name:"Outdoor Units Out of Sight",discipline:"mechanical",problem:"Condensers bolted to the front facade or dropped on the entrance path define how the building is seen and heard. They also need air, service access and a route for refrigerant that does not cross a dwelling.",solution:"Place each dwelling's outdoor unit on its own balcony first (short refrigerant line, private service access, screened by the balustrade); if the dwelling has no balcony, put it in the roof plant zone and run refrigerant up the shaft; only if there is no roof zone put it on a screened ground pad at the rear, never on the street elevation.",parameters:{preferenceOrder:{value:"balcony → roof plant zone → rear ground pad",source:"default"},outdoorUnitSize:{value:"0.90 × 0.35 × 0.80",unit:"m",source:"default (typical residential inverter ODU)"},serviceClearance:{value:.3,unit:"m",source:"manufacturer typical"},maxRefrigerantLine:{value:30,unit:"m",source:"manufacturer typical (mini-split)"}},dependsOn:["ARC-07"],references:["Alexander APL #160 Building Edge"]},{id:"MEC-05",name:"Corridor Make-up Air Spine",discipline:"mechanical",problem:"A double-loaded corridor with extract in every bathroom goes negative: doors slam, dwelling extract fans stall, and smells travel from flat to flat through the corridor.",solution:"Run one rectangular make-up air duct on the corridor centreline in the duct lane of the plenum, fed by a riser in the shaft nearest the core from a rooftop unit, with a diffuser every 9 m. The corridor is held slightly positive so air moves from the corridor into the dwellings and out through their wet rooms.",parameters:{makeUpAirRate:{value:.5,unit:"l/s·m² of corridor",source:"default (≈0.1 cfm/ft², corridor positive)"},diffuserSpacing:{value:9,unit:"m",source:"default"},ductLane:{value:0,unit:"m from corridor centreline",source:"XD-02"},ductDepth:{value:.3,unit:"m",source:"XD-02 plenum band"},rtuSize:{value:"2.40 × 1.20 × 1.40",unit:"m",source:"default"}},dependsOn:["XD-02","ARC-03"],references:["ASHRAE 62.1-2019 Table 6.2.2.1 (corridors)","IMC 2021 §403"]},{id:"MEC-06",name:"Plant on the Roof",discipline:"mechanical",problem:"Plant scattered over a site — condensers between the bike store and the bins, an AHU in the only ground-floor room with a window — eats lettable area and gives every neighbour something to complain about.",solution:"Collect shared plant in a roof plant zone sized at 0.25 m² per dwelling, laid out on a grid with 1 m service aisles, set back from the parapet behind a screen. Only plant that must be indoors (boilers, pumps, water-side plant) goes in a ground mechanical room.",parameters:{plantAreaPerUnit:{value:.25,unit:"m²/dwelling",source:"default"},aisleWidth:{value:1,unit:"m",source:"default (service access)"},condensersPerVrfCircuit:{value:8,unit:"dwellings/condenser",source:"default"},screenHeight:{value:1.8,unit:"m",source:"planning typical"}},dependsOn:["ARC-07","SIT-02"],references:["Alexander APL #118 Roof Garden (plant kept off the useful roof)"]},{id:"MEC-07",name:"Pressurised Stairs above 23 m",discipline:"mechanical",problem:"In a tall building the stair is the only way out and the only way in for the fire service. Smoke that enters it at the fire floor makes the whole stair useless.",solution:"Above 23 m to the highest occupied floor, give every stair core a roof-mounted pressurisation fan holding the stair positive relative to the accommodation, sized on the door-open case.",parameters:{heightTrigger:{value:23,unit:"m to highest occupied floor",source:"code:IBC 2021 §403/§909.20; BS EN 12101-6 / ADB Vol 1"},pressureDifferential:{value:50,unit:"Pa (all doors closed)",source:"code:BS EN 12101-6 Class A; NFPA 92"},doorOpenVelocity:{value:.75,unit:"m/s through the open door",source:"code:NFPA 92 §4.4.2"},fanSize:{value:"1.20 × 1.20 × 1.00",unit:"m",source:"default"}},references:["IBC 2021 §909.20","NFPA 92","BS EN 12101-6","Approved Document B Vol 1"]},{id:"MEC-08",name:"Heating Under the Window",discipline:"mechanical",problem:"A cold window sheds a downdraught across the floor and the room feels cold even when the air is warm. Heat emitters placed on an internal wall leave that draught to run under the furniture.",solution:"Put the emitter — panel radiator or packaged terminal unit — centred under the window of every habitable room, its length roughly 60% of the window width, its top below the sill so the curtain does not cover it.",parameters:{radiatorSize:{value:"1.00 × 0.10 × 0.60",unit:"m",source:"default (double-panel 600 mm)"},radiatorMountingZ:{value:.15,unit:"m above finished floor",source:"default"},ptacSize:{value:"1.07 × 0.60 × 0.40",unit:"m",source:'default (42" PTAC chassis)'},emitterBelowSill:{value:.05,unit:"m clear below the sill",source:"default"}},dependsOn:["ARC-10"],references:["Alexander APL #180 Window Place","CIBSE Domestic Heating Design Guide"]},{id:"MEC-09",name:"Balanced Ventilation per Dwelling",discipline:"mechanical",problem:"Extract-only ventilation in an airtight dwelling pulls its make-up air through whatever leaks it can find — the corridor, the neighbour's flat, the flue — and throws away all the heat it moves.",solution:"Give each dwelling one balanced heat-recovery box: supply ducts to the habitable rooms, extract ducts from the wet rooms, and a matched pair of outdoor-air and discharge ducts through the nearest exterior wall (or up the shaft in a tower). Size the whole-dwelling rate from occupancy, not area.",parameters:{ashraeRate:{value:"0.15 l/s·m² + 3.5 l/s/person",source:"code:ASHRAE 62.2-2019 §4.1.1"},partFRate:{value:"13 / 17 / 21 / 25 / 29 l/s for 1–5 bedrooms",source:"code:Approved Document F 2021 Table 1.3"},heatRecoveryEfficiency:{value:.85,unit:"fraction",source:"default (MVHR certified range 0.80–0.92)"},intakeExhaustSeparation:{value:1,unit:"m",source:"code:ASHRAE 62.2 §6.8 / ADF §1.28"},towerRoutesToShaft:{value:8,unit:"storeys above which intake/discharge use the shaft",source:"default"}},dependsOn:["XD-05"],references:["ASHRAE 62.2-2019","Approved Document F 2021 System 4"]},{id:"MEC-10",name:"One Thermostat per Home",discipline:"mechanical",problem:"Controls that live in a cupboard, or one per room with no hierarchy, mean nobody knows how to make the dwelling warmer. Shared controls between dwellings are worse: they guarantee an argument.",solution:"Give every dwelling exactly one thermostat, on an interior hall wall at 1.5 m, away from a draught, a radiator and direct sun; it commands that dwelling's heating, cooling and boost ventilation and nothing else. The electrical discipline picks it up from `mech.equipment` type `thermostat` and runs its cable.",parameters:{count:{value:1,unit:"per dwelling",source:"default"},mountingZ:{value:1.5,unit:"m above finished floor",source:"coordination.MOUNTING.thermostat; ADA 308 reach range"},size:{value:"0.10 × 0.03 × 0.10",unit:"m",source:"default"},wall:{value:"interior hall wall",source:"default"}},dependsOn:["MEC-01"],references:["ASHRAE 55 §7.6 (sensor location)","Alexander APL #142 Sequence of Sitting Spaces (control where you live)"]},{id:"MEC-11",name:"Range Hood over the Range",discipline:"mechanical",problem:"Cooking is the biggest indoor pollution source in a home. A recirculating filter, or a hood on the wrong wall, leaves grease and moisture to travel through the whole dwelling.",solution:"Put a ducted hood directly over the range, its face 0.75 m above the cooktop, the same width as the appliance or wider, with a dedicated smooth-bore duct to the kitchen-exhaust riser or straight out through the wall — never shared with bathroom extract.",parameters:{hoodSize:{value:"0.76 × 0.50 × 0.15",unit:"m",source:'default (30" hood)'},faceHeightAboveCooktop:{value:.75,unit:"m",source:"manufacturer typical / ADF §1.31"},airflow:{value:50,unit:"l/s",source:"code:ASHRAE 62.2 Table 5.1 (100 cfm vented hood)"},ductDiameter:{value:.15,unit:"m",source:"code:IMC 2021 §505 (smooth, no screens)"},dedicatedDuct:{value:!0,source:"code:IMC 2021 §506.3.1"}},dependsOn:["ARC-11"],references:["ASHRAE 62.2-2019 Table 5.1","IMC 2021 §505"]},{id:"MEC-12",name:"Loads from People not Area",discipline:"mechanical",problem:"Sizing a dwelling's systems from floor area alone gives a studio for one person the same fresh-air rate per square metre as a family flat, and oversizes everything in the big units while starving the small ones.",solution:"Derive design occupancy as bedrooms + 1 and size ventilation from it (ASHRAE 62.2 adds 3.5 l/s per person to a 0.15 l/s·m² base; Part F tabulates the whole-dwelling rate by bedroom count). Take cooling and heating from the regional intensity times the dwelling area, then size supply air from the cooling load at 400 cfm/ton.",parameters:{occupancy:{value:"bedrooms + 1",unit:"persons",source:"XD-05 / ASHRAE 62.2 §4.1.1"},ventilationPerPerson:{value:3.5,unit:"l/s·person",source:"code:ASHRAE 62.2-2019 §4.1.1"},ventilationPerArea:{value:.15,unit:"l/s·m²",source:"code:ASHRAE 62.2-2019 §4.1.1"},supplyAirPerCooling:{value:53.7,unit:"l/s per kW (400 cfm/ton)",source:"ACCA Manual S"}},dependsOn:["XD-0 entilationLs:Be(l+p.corridorLs),ductLengthM:Be(i.ductLengthM),diffuserCount:f,equipmentCount:i.equipment.length,riserCount:i.risers.length,rooftopUnits:p.rooftopUnits,coolingTons:Be(w*.284345),plantAreaM2:Be(g),exhaustFanCount:m,pressurisedStairs:p.pressurisedStairs,hvacSystemIndex:Math.max(0,Vm.indexOf(t)),terminalCount:i.terminals.length,ductRunCount:i.ducts.length,elementCount:i.elements.length,corridorMakeUpLs:Be(p.corridorLs),plantItems:p.plantItems}}}function Tx(e,t,n,r){return{system:e,ventilation:t,equipment:[],ducts:[],terminals:[],risers:[],plantRoomIds:[],loads:{coolingWPerM2:n,heatingWPerM2:r,ventilationLsPerPerson:3.5,totalCoolingKw:0,totalHeatingKw:0},elements:[],patterns:[],derived:{totalCoolingKw:0,totalHeatingKw:0,ventilationLs:0,ductLengthM:0,diffuserCount:0,equipmentCount:0,riserCount:0,rooftopUnits:0,coolingTons:0,plantAreaM2:0,exhaustFanCount:0,pressurisedStairs:0,hvacSystemIndex:Math.max(0,Vm.indexOf(e)),terminalCount:0,ductRunCount:0,elementCount:0,corridorMakeUpLs:0,plantItems:0}}}var od=[{id:"PLB-01",name:"One Stack per Dwelling Column",discipline:"plumbing",problem:'Every bathroom and kitchen needs waste, vent, cold and hot water. When each fixture group finds its own way down, a building fills with risers; every riser is a fire-stopped, acoustically sealed hole through every floor slab, and the plumbing cost of a dwelling roughly doubles. Worse, a riser that cannot find the same place on the floor below has to jog through a ceiling, and the jog is where the blockages and the leaks happen. A dwelling drawn with three or four "wet" walls invites three or four stacks.',solution:"Count stacks per DWELLING, not per wall. Within a dwelling pick the wet wall line carrying the most fixtures (kitchen and main bathroom back-to-back preferred) and put the stack on it, at the station that reaches the most fixtures inside their trap-arm limits — the station is computed in world coordinates, so a dwelling occupying several storeys keeps one vertical line through all of them. A second stack is opened only for fixtures the first cannot reach (PLB-02); beyond that budget a remote fixture gets an individually vented branch drain rather than another hole through every slab. Where the dwellings above repeat the plan, the stations coincide within the stacking tolerance and become one stack from the lowest dwelling storey to the roof. All five pipes live inside that one wall, spaced evenly apart: waste, vent, cold, hot and (with central hot water) the recirculation return.",parameters:{stacksPerDwellingTarget:{value:2,unit:"stacks/dwelling",source:"XD-01 (one wet wall per dwelling)"},stackAlignTolerance:{value:.3,unit:"m",source:"default (stud spacing + construction tolerance)"},wasteStackDiameter:{value:.1,unit:"m",source:"code:IPC 2021 Table 710.1(2) (4 in stack, ≤ 500 DFU)"},ventStackDiameter:{value:.075,unit:"m",source:"code:IPC 2021 Table 916.1 (3 in vent)"},dcwRiserDiameter:{value:.032,unit:"m",source:"code:IPC 2021 Appendix E (Ø50 above 10 storeys)"},dhwRiserDiameter:{value:.025,unit:"m",source:"default"},hwrRiserDiameter:{value:.02,unit:"m",source:"default (recirculation return)"},pipeSpacingInWall:{value:.08,unit:"m",source:"default (insulation + clip clearance)"},wetWallThickness:{value:.2,unit:"m",source:"XD-01"}},dependsOn:["XD-01","ARC-14"],references:["IPC 2021 §710, §916","BS EN 12056-2 §6","Alexander APL #144 Bathing Room"]},{id:"PLB-02",name:"Short Trap Arms",discipline:"plumbing",problem:"A trap keeps sewer gas out of a room by holding a plug of water. If the drain between the trap and the vented stack is too long, the falling water seals the pipe, drags air behind it and siphons the trap dry — and the room smells. Long branches also lose their fall and hold solids.",solution:"Put the stack where the fixtures are, not the fixtures where the stack is. Every trap arm runs from the fixture, perpendicular into the wet wall, then along the wall centreline to the stack — two axis-parallel legs, never a diagonal — and the developed length of an UNVENTED arm stays within the code limit for its diameter. When a fixture cannot be reached inside that limit, a second stack is opened at the station that covers the most of the remaining fixtures. Once the dwelling's stack budget is spent, a remote fixture is drained by an individually vented branch drain one size up, which the code allows to run further, and the layout problem is reported for architecture to fix.",parameters:{maxTrapArmDn50:{value:1.5,unit:"m",source:"code:IPC 2021 Table 1002.2 (1½ in → 6 ft)"},maxTrapArmDn100:{value:3,unit:"m",source:"code:IPC 2021 Table 1002.2 (4 in → 12 ft)"},maxVentedBranchDrain:{value:12,unit:"m",source:"code:IPC 2021 §912 + Table 704.1 (individually vented branch at the 1 % minimum fall drops 120 mm, the depth available at the waste invert)"},ventedBranchDiameter:{value:.075,unit:"m (minimum)",source:"code:IPC 2021 Table 710.1(1)"},branchDiameterWc:{value:.1,unit:"m",source:"code:IPC 2021 §709.1 (water closet 3 in min, 4 in used)"},branchDiameterOther:{value:.05,unit:"m",source:"code:IPC 2021 Table 709.1"},wasteInvertZ:{value:-.12,unit:"m (storey-local)",source:"default (within the floor build-up under the fixture)"},minSlope:{value:.02,unit:"m/m",source:"code:IPC 2021 Table 704.1 (1/4 in per ft)"}},dependsOn:["PLB-01"],references:["IPC 2021 Table 1002.2","BS EN 12056-2 Table 5","NCC Vol 3 AS/NZS 3500.2"]},{id:"PLB-03",name:"Vent Through Roof",discipline:"plumbing",problem:"Drainage only works if air can follow the water. A stack with no open top becomes a piston: it pulls traps dry on the floors above and blows them out on the floors below.",solution:"Every waste stack is paired with a vent of the next size down that continues past the highest fixture and terminates in open air above the roof, clear of any occupied roof deck, air intake or window. The vent is the only pipe in the wet wall that reaches the ROOF storey.",parameters:{ventTerminationHeight:{value:.9,unit:"m above roof",source:"code:IPC 2021 §904.1 (150 mm min; 2.1 m over occupied roof)"},ventDiameter:{value:.075,unit:"m",source:"code:IPC 2021 Table 916.1"},branchVentZ:{value:1.5,unit:"m (storey-local)",source:"code:IPC 2021 §905.4 (above the fixture flood rim)"},minDistanceToOpening:{value:3,unit:"m",source:"code:IPC 2021 §904.5"}},dependsOn:["PLB-01"],references:["IPC 2021 §904","BS EN 12056-2 §5.2"]},{id:"PLB-04",name:"Hot Water Close to the Tap",discipline:"plumbing",problem:"People run the tap while they wait for it to get hot. A long dead leg wastes water and energy every single draw-off, and water standing at 25–45 °C in that leg is where legionella grows.",solution:"Keep the distance from the source of hot water to the furthest tap short. With per-dwelling tanks or tankless heaters the source sits inside the dwelling, so the leg is a few metres by construction. With a central plant, a recirculation return (HWR) rides with the hot riser and loops the corridor mains, so no branch off the loop exceeds the dead-leg limit and a circulator keeps the loop above the storage temperature.",parameters:{maxDeadLeg:{value:15,unit:"m",source:"code:IPC 2021 §607.2 / ASHRAE 90.1 §7.4.5"},storageTemperature:{value:60,unit:"°C",source:"HSE ACoP L8 (legionella control)"},returnTemperature:{value:50,unit:"°C",source:"HSE ACoP L8"},hwrDiameter:{value:.02,unit:"m",source:"default"},storagePerOccupant:{value:40,unit:"l/person (central)",source:"CIBSE Guide G Table 2.4"},tankPerDwelling:{value:190,unit:"l (50 US gal)",source:"default (per-unit tank)"}},dependsOn:["PLB-01","XD-05"],references:["IPC 2021 §607","CIBSE Guide G","HSE ACoP L8"]},{id:"PLB-05",name:"Sprinklers Where People Sleep",discipline:"plumbing",problem:"Almost everyone who dies in a building fire dies in a dwelling, asleep, in the first few minutes. Compartmentation buys time for escape but does nothing about the room the fire starts in.",solution:"Put a residential sprinkler in every room people can be in, on a grid whose spacing and per-head coverage satisfy the residential standard, set just below the ceiling and clear of the walls. A branch line runs STRAIGHT along one row of that grid — a line of heads, not a tour of them — and the rows of a room gather to a room main at right angles; the room mains hang off the unit main above the entry door, the unit mains off a corridor main in the sprinkler lane of the service spine (or off the bar trunk on a floor with no corridor), which is fed by a riser in each stair core.",parameters:{coveragePerHead:{value:15,unit:"m²/head",source:"code:NFPA 13R §6.4.2 / NFPA 13D"},maxHeadSpacing:{value:3.7,unit:"m",source:"code:NFPA 13R §6.4.3 (12 ft)"},minDistanceFromWall:{value:.1,unit:"m",source:"code:NFPA 13 §8.5.3.1 (4 in)"},headDropBelowCeiling:{value:.05,unit:"m",source:"default (concealed pendent)"},minRoomAreaForGrid:{value:3,unit:"m²",source:"default (closets below get one head at 2 m²)"},branchLinesPerRoom:{value:"one per grid row",source:"default (a branch line is straight)"},branchLineDiameter:{value:.025,unit:"m",source:"code:NFPA 13R §6.5 (1 in branch)"},roomMainDiameter:{value:.032,unit:"m",source:"default"},unitMainDiameter:{value:.032,unit:"m",source:"default"},corridorMainDiameter:{value:.05,unit:"m",source:"default"},ukHeightTrigger:{value:11,unit:"m",source:"code:Approved Document B Vol 1 §0.16 (blocks of flats > 11 m)"},storeyTrigger:{value:3,unit:"storeys",source:"default (sprinkler above 3 storeys regardless of typology)"}},dependsOn:["XD-02"],references:["NFPA 13R 2022","NFPA 13D 2022","Approved Document B Vol 1 (2019, 2020 amdt)","AS 2118.4"]},{id:"PLB-06",name:"Roof Drains at Low Points, Downpipes at Cores",discipline:"plumbing",problem:"A flat roof is a shallow tank. One blocked outlet in a cloudburst and the water either finds the weakest lap or loads the structure with a tonne per square metre of ponding. A downpipe dropped wherever the outlet happens to be puts a live pipe through somebody's living room.",solution:"Two outlets minimum, and one for every catchment the design storm allows, set at the low points of the roof falls and paired so no single blockage drains nothing. Each outlet leads via an L-shaped leader to a downpipe that drops in the corner of a core or in the plumbing corner of a shaft — never through a dwelling — and the downpipes drop into a buried storm main that runs along the bar, picking each one up with a short perpendicular tap, and leaves the building perpendicular to the street edge.",parameters:{areaPerDrain:{value:400,unit:"m²/drain",source:"code:IPC 2021 Table 1106.2 (100 mm outlet, 100 mm/h)"},minDrains:{value:2,unit:"drains",source:"code:IPC 2021 §1105.1 (secondary drainage)"},downpipeDiameter:{value:.1,unit:"m",source:"code:IPC 2021 Table 1106.2"},buriedStormDiameter:{value:.15,unit:"m",source:"default"},buriedStormZ:{value:-1,unit:"m (storey-local, L01)",source:"default (below frost / under slab)"},drainSize:{value:.3,unit:"m (square sump)",source:"default"}},dependsOn:["ARC-20","XD-04"],references:["IPC 2021 §1105–1108","BS EN 12056-3","AS/NZS 3500.3"]},{id:"PLB-07",name:"Service Entry at the Street",discipline:"plumbing",problem:"Water comes from the street and sewage goes back to it. If the entry point is decided last, the incoming main crosses the building under the slab, the meter ends up where nobody can read or isolate it, and the drain has to be re-routed around the foundations.",solution:"Bring the cold water service in perpendicular to the street frontage, below frost depth, to a water room on the ground floor: meter, then backflow preventer, then (above eight storeys) a booster set. From there one main rises to the corridor service spine (or to the bar trunk, on a floor with no corridor). The building drain mirrors it: a collector below the ground slab runs along the same route, picks up each stack base with a vertical drop and a perpendicular tap, and leaves the building as an L — along the collector to the exit station, down to the sewer invert, then straight out to the street edge.",parameters:{serviceBurialDepth:{value:.9,unit:"m below ground floor",source:"default (frost cover; local authority)"},meterHeight:{value:.6,unit:"m (storey-local)",source:"default (readable, isolatable)"},sewerInvertZ:{value:-1.2,unit:"m (storey-local, L01)",source:"default"},buildingDrainZ:{value:-.55,unit:"m (storey-local, L01)",source:"default (below slab, above sewer)"},backflowPreventer:{value:"reduced-pressure principle",source:"code:IPC 2021 §608.13"},boosterStoreyThreshold:{value:8,unit:"storeys",source:"PLB-12"}},dependsOn:["SIT-01"],references:["IPC 2021 §603, §608, §701","BS 8558 §6"]},{id:"PLB-08",name:"Fixture Units Size the Pipe",discipline:"plumbing",problem:"Nobody uses every tap at once, so sizing a main for the sum of its fixtures buys a pipe twice as big as it needs to be — and sizing for the average leaves the top floor with no shower.",solution:"Count water supply fixture units (WSFU) for everything the pipe serves, convert to a probable simultaneous demand with Hunter's curve, then pick the smallest nominal diameter that carries that flow below the design velocity — and never smaller than the code minimum for the service. Drainage is sized the same way from drainage fixture units (DFU).",parameters:{hunterCoefficient:{value:.95,unit:"gpm/WSFU^b",source:"code:IPC 2021 Appendix E (Hunter 1940, flush-tank curve fit)"},hunterExponent:{value:.63,unit:"-",source:"code:IPC 2021 Appendix E"},minDemand:{value:5,unit:"gpm",source:"default (single dwelling floor)"},designVelocity:{value:2.4,unit:"m/s",source:"code:IPC 2021 §604.1 (erosion limit ~8 ft/s)"},minServiceDiameterMultiFamily:{value:.05,unit:"m",source:"code:IPC 2021 §603.1 / AWWA C700 (2 in)"},minServiceDiameterHouse:{value:.025,unit:"m",source:"code:IPC 2021 §603.1 (1 in)"},nominalLadder:{value:"20/25/32/40/50/65/80/100/150 mm",source:"default"}},references:["IPC 2021 Appendix E","Hunter, R.B., BMS 65 (1940)","BS 8558 Table 3"]},{id:"PLB-09",name:"Wet Rooms Share a Wall",discipline:"plumbing",problem:"A bathroom on one side of a plan and a kitchen on the other need two of everything: two stacks, two vents, two sets of penetrations, and twice the length of hot water dead leg.",solution:"Back the kitchen onto the bathroom across a single 200 mm wet wall, and back each dwelling's wet wall onto its neighbour's where the party wall allows, so two dwellings share one chase. Fixtures sit within the trap-arm limit of the shared stack on both faces, and the wall is thick enough to take a 100 mm stack plus its vent.",parameters:{wetWallThickness:{value:.2,unit:"m",source:"XD-01"},backToBackTolerance:{value:.3,unit:"m",source:"default"},maxFixtureDistanceToStack:{value:3,unit:"m",source:"PLB-02 / XD-01"},fixtureSetbackFromWall:{value:.4,unit:"m (synthesised fixtures)",source:"default (rough-in centreline)"}},dependsOn:["XD-01","ARC-21"],references:["IPC 2021 §1002","Alexander APL #144"]},{id:"PLB-10",name:"Standpipes in the Stairs",discipline:"plumbing",problem:"A firefighter carrying hose up eight floors arrives with no hose and no breath. Fire crews need pressurised water at the floor they are fighting on, inside the protected stair they arrived by.",solution:"Run a wet standpipe in the corner of every exit stair, from the fire department connection at the street face to the top floor, with an isolating valve at each landing and — once the building is tall enough to matter — a hose valve at every floor. The standpipe shares its riser zone with the sprinkler riser so one shutdown affects one stair.",parameters:{standpipeDiameter:{value:.1,unit:"m",source:"code:IBC 2021 §905 / NFPA 14 §7.6 (4 in)"},hoseValveHeight:{value:1.2,unit:"m (storey-local)",source:"code:NFPA 14 §7.3.3 (0.9–1.5 m)"},controlValveHeight:{value:1.5,unit:"m (storey-local)",source:"default"},hoseValveStoreyTrigger:{value:4,unit:"storeys",source:"code:IBC 2021 §905.3.1 (floor > 9.1 m above access)"},fdcHeight:{value:.9,unit:"m (storey-local, L01)",source:"code:NFPA 14 §7.12.2 (0.45–1.2 m)"},riserOffsetInCore:{value:.3,unit:"m from core corner",source:"default"}},dependsOn:["ARC-05"],references:["IBC 2021 §905","NFPA 14 2019","Approved Document B Vol 1 §15 (fire mains)"]},{id:"PLB-11",name:"Pipes Below Ducts, Beside Trays",discipline:"plumbing",problem:"Three trades share one corridor ceiling. Whoever installs first wins, the others drill through structure or drop the ceiling, and the corridor loses its head height.",solution:"Fix the lanes before anyone draws a run. Ducts take the centreline at the top of the plenum because they are biggest and least bendable; wet pipes take the lane toward the units 350 mm off centre and sit a band below the ducts, because a pipe can turn in 300 mm and needs a fall; the sprinkler main takes the 150 mm lane at the same height; cable trays take the far lane. Branches leave the lane perpendicular, above the unit entry door. A floor with no corridor (parking, retail, a lobby, a terrace of houses) has no spine to follow, so it gets ONE trunk per bar instead: along the bar's long axis, a metre inside the exterior wall on the side the risers are on, just under the slab — and every riser taps off it with a two-leg L. A main never chains risers together in id order: that is how a floor plate ends up with a diagonal snake across it.",parameters:{pipeLaneOffset:{value:-.35,unit:"m from corridor centreline",source:"XD-02"},sprinklerLaneOffset:{value:-.15,unit:"m from corridor centreline",source:"XD-02"},pipeBandBelowDuct:{value:.25,unit:"m",source:"core/coordination.plenumBands"},minClearanceAboveCeiling:{value:.05,unit:"m",source:"core/coordination.plenumBands"},trunkWallInset:{value:1,unit:"m inside the exterior wall",source:"default (floors with no corridor)"},trunkDropBelowSoffit:{value:.35,unit:"m",source:"default (below the beam/duct zone)"},maxRunPoints:{value:12,unit:"points per PipeRun",source:"default (a longer polyline is split into several runs)"},maxRunLengthFactor:{value:1.5,unit:"× the floo klerHeads:0,roofDrains:0,standpipes:0,hoseBibbs:0,waterDemandLPerDay:0,dhwStorageL:0,peakFlowLps:0,elementCount:0,runSplits:0,nonOrthogonalSegments:0,maxRunPoints:0,maxRunLength:0};for(let r of Ef)t[`pipeLength.${r}`]=0;return t.pipeLengthTotal=0,{dhw:e,sprinklered:!1,fixtures:[],stacks:[],pipes:[],roofDrains:[],totals:{dfu:0,wsfu:0,fixtureCount:0,serviceDiameter:0},elements:[],patterns:[],derived:t}}var Ed=[{id:"ELE-01",name:"Service at the Street, Meters at the Entrance",discipline:"electrical",problem:"Power arrives from the street, but the rooms that need it are deep inside the building. If the incoming service, the meters and the main switchboard are placed wherever space is left over, the utility cannot read or maintain them, the service conductors run half the length of the building at full fault current, and the switchroom ends up behind a dwelling door.",solution:"Bring one buried service lateral in from the street edge on the shortest line, at 800 mm cover, to a switchroom on the ground floor near the entrance. Put the main switchboard against the longest clear wall with a metre of working space in front of it, and stack the meters one per dwelling in banks of six beside it so a meter reader never enters a dwelling. Where the service exceeds 600 A, give the utility a pad-mounted transformer on the front boundary within 15 m of the switchroom.",parameters:{lateralCover:{value:.8,unit:"m",source:"code:NEC 300.5 Table (600 V direct burial)"},lateralDiameter:{value:.1,unit:"m",source:"default (duct for 4 × 250 mm² conductors)"},metersPerStack:{value:6,unit:"meters",source:"default (utility metering panel module)"},workingClearance:{value:1,unit:"m",source:"code:NEC 110.26(A)(1) Condition 1"},transformerThresholdAmps:{value:600,unit:"A",source:"default (utility pad-mount threshold)"},transformerSize:{value:"1.6 × 1.2 × 1.5",unit:"m",source:"default (single-phase pad-mount)"}},references:["NEC 2023 Art. 230 (Services)","NEC 110.26","BS 7671 §8.2 / DNO cut-out requirements","AS/NZS 3000 §2.2"]},{id:"ELE-02",name:"One Panel per Dwelling in the Hall",discipline:"electrical",problem:"A dwelling whose overcurrent devices live in another dwelling, in a locked riser, or behind the bathroom door cannot be isolated by the person who lives in it. Panels also attract the leftover wall — the back of a wardrobe, the wall over the stairs — where nobody can stand in front of them.",solution:"Give every dwelling one panelboard, on a wall of the entry hall or utility room within a few metres of the front door, bottom at 1.2 m so every breaker handle sits between 0.6 m and 2.0 m above the floor. Never in a bathroom, a bedroom, a clothes closet, a kitchen or over a step. Size it from the dwelling demand: 100 A for a studio or one-bed, 125 A for a two-bed, 200 A for three beds and houses; a 100 A consumer unit under BS 7671.",parameters:{panelsPerDwelling:{value:1,unit:"panel",source:"code:NEC 230.71"},bottomHeight:{value:1.2,unit:"m",source:"code:NEC 240.24(A) (handle ≤ 2.0 m)"},forbiddenRooms:{value:"bathroom, bedroom, clothes closet, kitchen, over steps",source:"code:NEC 240.24(D)(E)"},ampsStudio1b:{value:100,unit:"A",source:"code:NEC 220.82 demand"},amps2b:{value:125,unit:"A",source:"code:NEC 220.82 demand"},amps3bPlus:{value:200,unit:"A",source:"code:NEC 220.82 demand"},ampsUk:{value:100,unit:"A",source:"code:BS 7671 (100 A consumer unit)"}},dependsOn:["ELE-01","ARC-06"],references:["NEC 240.24","NEC 230.71","BS 7671 §421.1.201","AS/NZS 3000 §2.3"]},{id:"ELE-03",name:"No Point Farther Than Six Feet",discipline:"electrical",problem:"Furniture moves; extension leads do not belong under rugs. When outlets are counted per room instead of measured along the walls, a long wall gets one outlet at the door and the sofa wall gets none — and the lamp cord crosses the floor.",solution:"Walk every wall space of every habitable room. Treat each stretch of wall 0.6 m or wider, broken by doors and by glazing whose sill falls below the outlet, as its own wall space, and place outlets so no point along the floor line is more than 1.8 m from one: an outlet within 1.8 m of each end and never more than 3.6 m apart. Mount at 0.4 m to the box centre. In BS 7671 and AS/NZS regions apply the same spacing but count sockets against the room minima — four doubles in a living room, three in a bedroom, six in a kitchen.",parameters:{maxReach:{value:1.8,unit:"m",source:"code:NEC 210.52(A)(1) (6 ft)"},maxSpacing:{value:3.6,unit:"m",source:"code:NEC 210.52(A)(1) (12 ft)"},minWallSpace:{value:.6,unit:"m",source:"code:NEC 210.52(A)(2) (2 ft)"},mountingHeight:{value:.4,unit:"m",source:"default (NEC/ADA 0.38–1.2 m reach range)"},hallwayThreshold:{value:3,unit:"m",source:"code:NEC 210.52(H) (10 ft hallway)"},ukLivingDoubles:{value:4,unit:"double sockets",source:"BS 7671 App. 15 / IET On-Site Guide"},ukBedroomDoubles:{value:3,unit:"double sockets",source:"BS 7671 App. 15 / IET On-Site Guide"},ukKitchenDoubles:{value:6,unit:"double sockets",source:"BS 7671 App. 15 / IET On-Site Guide"}},dependsOn:["ELE-02"],references:["NEC 210.52(A)","NEC 210.52(H)","BS 7671 Appendix 15","AS/NZS 3000 §4.4"]},{id:"ELE-04",name:"Kitchen Counter Circuits",discipline:"electrical",problem:"A kitchen draws more current per square metre than any other room in a dwelling, and it draws it in short, simultaneous bursts at the counter. One general circuit for the whole room trips at breakfast, and a single outlet at the end of a three-metre counter guarantees a kettle flex across the sink.",solution:"Serve the counter with two dedicated 20 A small-appliance circuits and alternate outlets between them, so no point along the counter wall line is more than 0.6 m from a receptacle — an outlet every 1.2 m at 1.1 m above the floor, all GFCI/RCD protected. Give the range, the refrigerator, the dishwasher, the disposal and the microwave their own circuits at nameplate rating, and put under-cabinet task light over the working surface.",parameters:{counterSpacing:{value:1.2,unit:"m",source:"code:NEC 210.52(C)(1) (no point > 600 mm)"},counterHeight:{value:1.1,unit:"m",source:"default (100 mm above a 900 mm counter)"},smallApplianceCircuits:{value:2,unit:"circuits at 20 A",source:"code:NEC 210.11(C)(1)"},gfciRequired:{value:!0,source:"code:NEC 210.8(A)(6)"},rangeVa:{value:8e3,unit:"VA",source:"code:NEC Table 220.55 (nameplate)"},dishwasherVa:{value:1200,unit:"VA",source:"default (nameplate)"},refrigeratorVa:{value:800,unit:"VA",source:"default (nameplate)"},microwaveVa:{value:1500,unit:"VA",source:"default (nameplate)"},taskLux:{value:300,unit:"lx",source:"EN 12464-1 / IES RP-11 kitchen work surface"}},dependsOn:["ELE-03","XD-01"],references:["NEC 210.52(C)","NEC 210.11(C)(1)","NEC 210.8(A)","BS 7671 §411.3.3"]},{id:"ELE-05",name:"Switch at the Latch Side",discipline:"electrical",problem:"You reach for a light switch in the dark with the hand that is not holding the door. A switch behind the opening leaf, or on the hinge side, or three paces into the room, makes every entry a fumble — and a room whose only control is at the far end is a room people leave lit.",solution:"Put one wall switch inside every room, on the latch side of the door it is entered through, 0.15 m clear of the opening, at 1.2 m to the centre. Rooms with two ways in — halls, stairs, through-rooms — get a switch at each end wired three-way. Living rooms get a dimmer. The switch controls the room lighting group, never the group next door.",parameters:{offsetFromOpening:{value:.15,unit:"m",source:"default (clear of architrave)"},mountingHeight:{value:1.2,unit:"m",source:"default (ADA 1.2 m max reach / Part M 0.9–1.2 m)"},switchesPerRoom:{value:1,unit:"switch",source:"code:NEC 210.70(A)(1)"},threeWayRooms:{value:"hall, stair",source:"code:NEC 210.70(A)(2)(c)"},dimmerRooms:{value:"living, dining",source:"default"}},dependsOn:["ELE-13"],references:["NEC 210.70","BS 7671 §559","Approved Document M §4.30"]},{id:"ELE-06",name:"Alarms Where People Sleep",discipline:"electrical",problem:"Fire kills people who are asleep. A single alarm in a hallway is inaudible behind a closed bedroom door, and an alarm that only its own room can hear does not wake the household. Combustion appliances and cars add carbon monoxide, which no smoke sensor detects.",solution:"Put an interconnected smoke alarm on the ceiling of every bedroom, in the hall or landing immediately outside the bedrooms, and at least one on every level of the dwelling; in common corridors repeat them at 15 m. Add a CO alarm in the circulation space adjacent to the bedrooms wherever a fuel-burning appliance or an attached garage exists, and one per dwelling as a baseline in NEC and BS regions. Use heat detection — not smoke — in garages, plant rooms and switchrooms. All units on a dedicated circuit with battery backup, interconnected so one alarm sounds them all.",parameters:{bedroomAlarms:{value:1,unit:"alarm per bedroom",source:"code:IRC R314.3 / NFPA 72 §29.8.1"},outsideBedrooms:{value:1,unit:"alarm per sleeping area",source:"code:IRC R314.3(2)"},perLevel:{value:1,unit:"alarm per storey",source:"code:IRC R314.3(3)"},corridorSpacing:{value:15,unit:"m",source:"code:NFPA 72 §17.6.3 (spot spacing 9.1 m, corridors to 12.8 m)"},coAlarmTrigger:{value:"fuel appliance or attached garage",source:"code:IRC R315.2 / BS 5839-6 §8"},grade:{value:"Grade D1 LD2",source:"code:BS 5839-6:2019 Table 1 (new dwellings)"},interconnected:{value:!0,source:"code:NFPA 72 §29.7"}},references:["NFPA 72 §29","IRC R314 / R315","BS 5839-6:2019","AS 3786 / NCC Part 3.7.5"]},{id:"ELE-07",name:"Corridor Tray Spine",discipline:"electrical",problem:"Power and data that cross dwellings to reach the next dwelling puncture the party walls, break the acoustic and fire separation, and put every future alteration inside somebody's home. Horizontal runs also fight the ducts and the sprinkler main for the same 400 mm of ceiling.",solution:"Run a cable tray spine down the corridor ceiling plenum in a fixed lane 0.35 m off the centreline, on the opposite side from the wet pipes, with a smaller data tray 0.15 m outboard of it. Drop each dwelling feeder out of the spine directly above its entry door: one horizontal length to the wall line, one vertical drop to the top of the panel. Nothing horizontal ever enters a dwelling except its own feeder.",parameters:{trayLaneOffset:{value:.35,unit:"m from the corridor centreline",source:"XD-02"},dataTrayOffset:{value:.15,unit:"m outboard of the power tray",source:"default"},powerTraySize:{value:"0.3 × 0.1",unit:"m",source:"default (300 mm perforated tray)"},dataTraySize:{value:"0.2 × 0.05",unit:"m",source:"default (200 mm basket)"},feederConduit:{value:.032,unit:"m",source:"default (Ø32 for a 100 A dwelling feeder)"},clearanceBelowDuct:{value:.25,unit:"m",source:"XD-02 plenum bands"}},dependsOn:["XD-02","ELE-02"],references:["NEC Art. 392 (Cable Trays)","BS 7671 §521","XD-02 Corridor Service Spine"]},{id:"ELE-08",name:"Emergency Light the Way Out",discipline:"electrical",problem:"In the dark, in smoke, in a power cut, the exit is invisible. Corridors that read clearly in daylight become a maze, and a stair door with no sign above it is indistinguishable from a dwelling door.",solution:"Sign every exit and stair door with an illuminated exit sign at 2.3 m on the egress side, and light the path of travel with emergency luminaires at 15 m along every corridor plus one beside each stair door and at the exit discharge, all on a dedicated life-safety circuit with 90 minutes of battery autonomy and at least 1 lux on the centreline.",parameters:{exitSignHeight:{value:2.3,unit:"m",source:"code:IBC §1013.1 (above the door opening)"},emergencySpacing:{value:15,unit:"m",source:"code:BS 5266-1 §5 / IBC §1008.3"},minCentrelineLux:{value:1,unit:"lx",source:"code:IBC §1008.3.4 (avg 10.8 lx initial) / BS 5266 1 lx"},autonomy:{value:90,unit:"min",source:"code:IBC §1008.3.5 / BS 5266 3 h for sleeping risk"},dedicatedCircuit:{value:!0,source:"code:NEC 700.10"}},dependsOn:["ELE-07","ARC-08"],references:["IBC 2021 §1008, §1013","BS 5266-1:2016","NFPA 101 §7.9","NEC Art. 700"]},{id:"ELE-09",name:"Sun on the Roof",discipline:"electrical",problem:"A flat residential roof is the cheapest generating site a building will ever have, but the plant, the stair bulkhead, the roof drains and the maintenance walkways get there first, and an array laid edge to edge shades itself and cannot be cleaned.",solution:"Fill the PV zone the roof plan reserves — clear of the plant zone and the parapet setback — with modules in rows one module wide, leaving a 0.5 m gap between rows for access and self-shading. Combine the strings at a combiner box next to the plant zone, invert beside it, and cap the array at the building demand so it stays behind the meter.",parameters:{moduleSize:{value:"1.0 × 1.7",unit:"m",source:"default (standard 60-cell module)"},moduleWp:{value:400,unit:"Wp",source:"default (2024 monocrystalline)"},rowGap:{value:.5,unit:"m",source:"default (maintenance access, flat mount)"},parapetSetback:{value:1,unit:"m",source:"code:NFPA 1 §11.12 / roof access"},targetCoverage:{value:.65,unit:"fraction of the PV zone",source:"default"},dcAcRatio:{value:1.2,unit:"ratio",source:"default (string inverter sizing)"}},dependsOn:["ARC-13"],references:["NEC Art. 690","IEC 62548","AS/NZS 5033","MCS 012 (UK)"]},{id:"ELE-10",name:"Charge Where You Park",discipline:"electrical",problem:"Retrofitting chargers into a finished car park means trenching the slab and running a new riser from the switchroom. Meanwhile a charger at every stall would double the service size for a load that is almost never coincident.",solution:"Put a charger at the head of every stall flagged EV-ready and one in every private garage, fed from a dedicated EV panel in the parking area, and size the panel with energy management: 50 % diversity across the chargers rather than the connected sum. Leave conduit capacity to the remaining stalls so the rest can be energised without breaking concrete.",parameters:{chargerPower:{value:7.2,unit:"kW",source:"default (32 A at 230 V / 30 A at 240 V)"},chargerSize:{value:"0.3 × 0.15 × 1.2",unit:"m",source:"default (pedestal)"},evShare:{value:.2,unit:"fraction of stalls",source:"spec (site.parking.evShare)"},diversity:{value:.5,unit:"factor",source:"code:NEC 625.42 (energy management)"},circuitAmps:{value:40,unit:"A",source:"code:NEC 625.41 (125 % continuous)"},partS:{value:"1 charge point per dwelling with parking",source:"code:Approved Document S (2022)"}},dependsOn:["SIT-06","ELE-11"],references:["NEC Art. 625","Approved Document S 2022","AS/NZS 3000 §7.9","CEC 86-300"]},{id:"ELE-11",name:"Demand not Connected Load",discipline:"electrical",problem:"Add up every nameplate in a building of forty dwellings and you will size a service two or three times larger than the building will ever draw — expensive switchgear, oversized conductors, a transformer the utility will not pay for. Guess low instead and the main trips on a cold January evening.",solution:"Calculate each dwelling as a demand, not a sum: general lighting at 33 VA/m², two small-appliance circuits and a laundry circuit, plus appliance nameplates — the first 10 kVA at 100 % and everything above it at 40 %, with heating or cooling added at 100 %. Then apply the multifamily demand factor to the sum of the dwellings (45 % at three to five dwellings falling to 23 % above sixty), add the house load at 100 %, and round up to the next standard frame size.",parameters:{generalLighting:{value:33,unit:"VA/m²",source:"code:NEC 220.12 (3 VA/ft²)"},smallAppliance:{value:1500,unit:"VA per circuit × 2",source:"code:NEC 220.52(A)"},laundry:{value:1500,unit:"VA",source:"code:NEC 220.52(B)"},firstTranche:{value:1e4,unit:"VA at 100 %",source:"code:NEC 220.82(B)"},remainder:{value:.4,unit:"factor",source:"code:NEC 220.82(B)(3)"},hvacFactor:{value:1,unit:"factor",source:"code:NEC 220.82(C)"},multifamily3to5:{value:.45,unit:"factor",source:"code:NEC Table 220.84"},multifamily62plus:{value:.23,unit:"factor",source:"code:NEC Table 220.84"},houseLighting:{value:10,unit:"VA/m² of common area",source:"default"},elevatorLoad:{value:20,unit:"kVA each",source:"default (MRL traction, 1000 kg)"},standardFrames:{value:"200/400/600/800/1200/1600/2000/2500/3000/4000",unit:"A",source:"default (switchboard frames)"}},references:["NEC 220.12, 220.52, 220.82, 220.84","BS 7671 Appendix A (diversity)","IET On-Site Guide §A","AS/NZS 3000 App. C"]},{id:"ELE-12",name:"Risers at the Core",discipline:"electrical",problem:"A riser placed for the convenience of one floor becomes a hole through every other floor. Scattered vertical runs steal saleable area, break compartmentation, and leave the busduct in the middle of somebody's living room three floors up.",solution:"Take the vertical distribution up the electrical or combined shaft beside the stair core, on the shaft's far corner so the mechanical duct (centre) and the plumbing stack (near corner) never collide with it: busduct above six storeys, cable riser below. Tap the riser at each floor into a floor distribution board on the corridor wall, and feed the dwellings from there.",parameters:{shaftCornerOffset:{value:.15,unit:"m from the shaft max corner",source:"default (coordination convention)"},busductSize:{value:"0.3 × 0.2",unit:"m",source:"default (800 A sandwich busduct)"},busductThreshold:{value:6,unit:"storeys",source:"default"},floorBoardThreshold:{value:4,unit:"storeys",source:"default"},fireStopping:{value:"every floor penetration",source:"code:IBC §714 / BS 7671 §527.2"}},dependsOn:["XD-04"],references:["XD-04 Shafts at the Core","NEC Art. 368 (Busways)","IBC §714","BS 7671 §527"]},{id:"ELE-13",name:"Light by Task not Watts",discipline:"electrical",problem:"Lighting designed by watts per square metre gives a bedroom the same flat ceiling grid as a kitchen and leaves the worktop in the cook's shadow. Designed by fixture count alone, it either glares or fails to reach the task.",solution:"Set a
