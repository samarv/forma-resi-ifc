<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Forma Residential → IFC</title>
<style>
/* ==========================================================================
   Forma Residential → IFC — single-file app styles.
   Palette: neutral greys + one accent, validated categorical slots for data,
   reserved status colours. Light and dark render identically in structure.
   ========================================================================== */

:root {
  color-scheme: light dark;

  /* surfaces + ink */
  --plane: #f4f4f1;
  --surface: #fcfcfb;
  --surface-2: #f0efec;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --rule: #e1e0d9;
  --rule-2: #c3c2b7;
  --border: rgba(11, 11, 11, .10);
  --shadow: 0 1px 2px rgba(11, 11, 11, .06), 0 8px 24px rgba(11, 11, 11, .08);

  /* accent = categorical slot 1 */
  --accent: #2a78d6;
  --accent-ink: #fff;
  --accent-wash: rgba(42, 120, 214, .12);

  /* categorical slots (fixed order, never cycled) */
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s5: #e87ba4;
  --s6: #008300;
  --s7: #4a3aa7;
  --s8: #e34948;

  /* status (reserved — always with a label) */
  --ok: #0ca30c;
  --warn: #fab219;
  --serious: #ec835a;
  --fail: #d03b3b;
  --ok-wash: rgba(12, 163, 12, .10);
  --warn-wash: rgba(250, 178, 25, .14);
  --fail-wash: rgba(208, 59, 59, .10);

  /* drawing */
  --dwg-bg: #fdfdfc;
  --dwg-outline: #6f6e69;
  --dwg-wall-ext: #23221f;
  --dwg-wall-party: #3c3a35;
  --dwg-wall-core: #2d2b27;
  --dwg-wall-part: #7b7972;
  --dwg-open: #2a78d6;
  --dwg-room: #e8e7e2;
  --dwg-room-pub: #e5ebf2;
  --dwg-room-priv: #ece7f2;
  --dwg-room-serv: #efe9e1;
  --dwg-room-circ: #e6e5e0;
  --dwg-room-out: #e4efe4;
  --dwg-label: #4a4945;
  --dwg-grid: #a8a6a0;
  --dwg-struct: #4a3aa7;
  --dwg-mech: #2a78d6;
  --dwg-plumb: #1baf7a;
  --dwg-elec: #eb6834;
  --dwg-site: #008300;
  --dwg-hatch: rgba(80, 78, 72, .55);
  --dwg-hl: #d03b3b;

  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px;
  --sidebar-w: 360px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --plane: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232321;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --rule: #2c2c2a;
    --rule-2: #383835;
    --border: rgba(255, 255, 255, .12);
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .45);

    --accent: #3987e5;
    --accent-wash: rgba(57, 135, 229, .18);

    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --s5: #d55181;
    --s6: #008300;
    --s7: #9085e9;
    --s8: #e66767;

    --ok-wash: rgba(12, 163, 12, .16);
    --warn-wash: rgba(250, 178, 25, .16);
    --fail-wash: rgba(208, 59, 59, .18);

    --dwg-bg: #161615;
    --dwg-outline: #8d8b84;
    --dwg-wall-ext: #e8e7e1;
    --dwg-wall-party: #cbc9c1;
    --dwg-wall-core: #dbd9d2;
    --dwg-wall-part: #908e86;
    --dwg-open: #6da7ec;
    --dwg-room: #262623;
    --dwg-room-pub: #222a33;
    --dwg-room-priv: #29242f;
    --dwg-room-serv: #2b2621;
    --dwg-room-circ: #242422;
    --dwg-room-out: #1f2a20;
    --dwg-label: #c3c2b7;
    --dwg-grid: #6a6862;
    --dwg-struct: #9085e9;
    --dwg-mech: #3987e5;
    --dwg-plumb: #199e70;
    --dwg-elec: #d95926;
    --dwg-site: #0ca30c;
    --dwg-hatch: rgba(190, 188, 180, .5);
    --dwg-hl: #e66767;
  }
}

* { box-sizing: border-box; }
/* class rules below set `display`, which would otherwise beat the UA [hidden] rule */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  font: 13px/1.45 var(--font);
  color: var(--ink);
  background: var(--plane);
  -webkit-font-smoothing: antialiased;
}

/* ---------------------------------------------------------------- layout */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "hdr hdr" "side main" "status status";
  height: 100vh;
  height: 100dvh;
}
.hdr {
  grid-area: hdr;
  display: flex; align-items: center; gap: 16px; justify-content: space-between;
  padding: 10px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}
.hdr-title { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.hdr-arrow { color: var(--ink-3); font-weight: 400; }
.hdr-sub { margin: 1px 0 0; font-size: 11.5px; color: var(--ink-2); }
.hdr-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

.sidebar {
  grid-area: side;
  overflow-y: auto; overflow-x: hidden;
  border-right: 1px solid var(--rule);
  background: var(--surface);
  padding: 10px 12px 40px;
}
.main { grid-area: main; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.panels { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.panel { position: absolute; inset: 0; display: none; flex-direction: column; min-height: 0; }
.panel.is-active { display: flex; }
.panel-scroll { overflow: auto; padding: 14px 16px 28px; }

/* ---------------------------------------------------------------- controls */
.btn {
  font: inherit; font-size: 12px; line-height: 1;
  padding: 7px 10px; border-radius: var(--r);
  border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(.5px); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 600; }
.btn-primary:hover { background: var(--accent); filter: brightness(1.06); }
.btn-sm { padding: 4px 7px; font-size: 11px; }
.btn-icon { padding: 4px 6px; font-size: 12px; }

input[type=text], input[type=number], select, textarea {
  font: inherit; font-size: 12px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 5px; padding: 4px 6px; width: 100%; min-width: 0;
}
input[type=number] { font-variant-numeric: tabular-nums; }
select { padding-right: 4px; }
input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); }

/* ------------------------------------------------------------------- form */
.sec { border: 1px solid var(--rule); border-radius: var(--r); margin-bottom: 8px; background: var(--surface); }
.sec > summary {
  cursor: pointer; list-style: none; padding: 7px 9px;
  font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2);
  display: flex; align-items: center; gap: 6px;
}
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary::before { content: "▸"; color: var(--ink-3); font-size: 9px; }
.sec[open] > summary::before { content: "▾"; }
.sec > summary:hover { color: var(--ink); }
.sec-body { padding: 4px 9px 10px; border-top: 1px solid var(--rule); }

.row { display: grid; grid-template-columns: 1fr 118px; gap: 6px; align-items: center; margin: 5px 0; }
.row > label { font-size: 11.5px; color: var(--ink-2); }
.row-wide { grid-template-columns: 1fr; }
.row-wide > label { margin-bottom: 2px; }
.row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 5px 0; }
.row-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 5px 0; }
.field { display: flex; flex-direction: column; gap: 2px; }
.field > label { font-size: 10.5px; color: var(--ink-3); }
.suffix { position: relative; display: flex; align-items: center; gap: 4px; }
.suffix > span { font-size: 10px; color: var(--ink-3); white-space: nowrap; }
.hint { font-size: 10.5px; color: var(--ink-3); margin: 2px 0 6px; }
.hint-warn { color: var(--serious); }
.desc { font-size: 11px; color: var(--ink-2); margin: 3px 0 7px; }
.slider-row { display: grid; grid-template-columns: 1fr 58px; gap: 8px; align-items: center; }
.toggles { display: flex; flex-wrap: wrap; gap: 5px 10px; margin: 4px 0; }
.toggle { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--ink-2); cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.seg > button { font: inherit; font-size: 11px; padding: 4px 8px; border: 0; background: var(--surface); color: var(--ink-2); cursor: pointer; }
.seg > button + button { border-left: 1px solid var(--border); }
.seg > button[aria-pressed=true] { background: var(--accent-wash); color: var(--ink); font-weight: 600; }

.tbl { width: 100%; border-collapse: collapse; font-size: 11px; }
.tbl th { text-align: left; font-weight: 600; color: var(--ink-3); padding: 3px 4px; border-bottom: 1px solid var(--rule); font-size: 10px; text-transform: uppercase; letter-spacing: .03em; }
.tbl td { padding: 2px 4px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl input[type=number], .tbl select { padding: 2px 4px; font-size: 11px; }
.tbl-mini td, .tbl-mini th { padding: 1px 3px; }
/* 8 columns do not fit a 360 px sidebar: keep them legible and let the wrapper scroll */
.tbl-floors { min-width: 430px; }
.tbl-floors select { min-width: 84px; }
.mix-row td { background: var(--surface-2); }
.wt { display: grid; grid-template-columns: 1fr 18px; gap: 4px; align-items: center; }
.wt > span { font-size: 10px; color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
.tpl-name { font-weight: 550; }
.tpl-sub { color: var(--ink-3); }
code, .mono { font-family: var(--mono); font-size: 11px; }
pre.json {
  margin: 4px 0 0; padding: 7px; background: var(--surface-2); border-radius: 5px;
  font-family: var(--mono); font-size: 10.5px; line-height: 1.4; max-height: 260px; overflow: auto;
  white-space: pre-wrap; word-break: break-word; color: var(--ink-2);
}

/* ------------------------------------------------------------------- tabs */
.tabs { display: flex; gap: 2px; padding: 6px 10px 0; background: var(--surface); border-bottom: 1px solid var(--rule); }
.tab {
  font: inherit; font-size: 12px; padding: 6px 12px 7px; border: 1px solid transparent; border-bottom: 0;
  background: transparent; color: var(--ink-2); cursor: pointer; border-radius: var(--r) var(--r) 0 0;
  margin-bottom: -1px;
}
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-selected=true] {
  background: var(--plane); color: var(--ink); font-weight: 600;
  border-color: var(--rule); border-bottom: 1px solid var(--plane);
}
.tab-count { color: var(--ink-3); font-weight: 400; font-size: 10.5px; margin-left: 4px; }

/* -------------------------------------------------------------- viewports */
.toolbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 6px 10px; border-bottom: 1px solid var(--rule); background: var(--surface); min-height: 34px;
}
.toolbar-label { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); }
.chips { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; }
.chip {
  font: inherit; font-size: 11px; padding: 3px 7px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); cursor: pointer;
  white-space: nowrap;
}
.chip:hover { background: var(--surface-2); color: var(--ink); }
.chip[aria-pressed=true] { background: var(--accent-wash); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.chip-dot { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 4px; vertical-align: baseline; }
.spacer { flex: 1; }

.viewport-wrap { position: relative; flex: 1; min-height: 0; display: flex; }
.viewport { position: relative; flex: 1; min-width: 0; background: var(--dwg-bg); overflow: hidden; cursor: grab; }
.viewport.is-panning { cursor: grabbing; }
.viewport > svg { display: block; width: 100%; height: 100%; touch-action: none; }
.viewport-empty {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--ink-3); font-size: 12px; text-align: center; padding: 20px;
}
.dwg-tip {
  position: absolute; pointer-events: none; z-index: 5; max-width: 300px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--rule-2);
  border-radius: 5px; padding: 5px 7px; font-size: 11px; box-shadow: var(--shadow);
}
.dwg-tip b { font-weight: 650; }
.dwg-tip dl { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; margin: 3px 0 0; }
.dwg-tip dt { color: var(--ink-3); }
.dwg-tip dd { margin: 0; font-variant-numeric: tabular-nums; }
.side-card {
  width: 250px; flex: 0 0 250px; border-left: 1px solid var(--rule); background: var(--surface);
  overflow: auto; padding: 9px 10px; font-size: 11.5px;
}
.side-card h4 { margin: 0 0 4px; font-size: 12px; }
.side-card dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; margin: 6px 0 0; }
.side-card dt { color: var(--ink-3); }
.side-card dd { margin: 0; word-break: break-word; }
.side-card-close { float: right; }

/* ---------------------------------------------------------------- metrics */
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px; }
.cat-h {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3);
  margin: 18px 0 7px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); font-weight: 650;
}
.cat-h:first-child { margin-top: 0; }
.tile {
  background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r);
  padding: 9px 10px; display: flex; flex-direction: column; gap: 2px; position: relative;
}
.tile-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.tile-label { font-size: 11.5px; color: var(--ink-2); }
.tile-alt { font-size: 10px; color: var(--ink-3); }
.tile-rank {
  font-size: 9.5px; color: var(--ink-3); border: 1px solid var(--border); border-radius: 999px;
  padding: 0 5px; line-height: 15px; flex: none; font-variant-numeric: tabular-nums;
}
.tile-value { font-size: 23px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; margin-top: 2px; }
.tile-unit { font-size: 11px; color: var(--ink-3); font-weight: 400; margin-left: 3px; }
.tile-note { font-size: 10.5px; color: var(--ink-2); }
.tile-status { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 600; }
.st-ok { color: var(--ok); }
.st-warn { color: var(--serious); }
.st-fail { color: var(--fail); }
.tile.is-warn { border-left: 3px solid var(--warn); }
.tile.is-fail { border-left: 3px solid var(--fail); }
.tile.is-ok { border-left: 3px solid var(--ok); }
.bars { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
.bar-row { display: grid; grid-template-columns: 74px 1fr auto; gap: 6px; align-items: center; font-size: 10.5px; }
.bar-row > span:first-child { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 8px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 0 3px 3px 0; }
.bar-val { color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* --------------------------------------------------------------- patterns */
.pat {
  border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); margin-bottom: 5px;
}
.pat > summary { cursor: pointer; list-style: none; padding: 7px 9px; display: flex; align-items: center; gap: 8px; }
.pat > summary::-webkit-details-marker { display: none; }
.pat-id { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); flex: none; width: 46px; }
.pat-name { font-weight: 600; font-size: 12px; }
.pat-count { margin-left: auto; font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; flex: none; }
.pat-body { padding: 0 10px 10px 10px; border-top: 1px solid var(--rule); font-size: 11.5px; }
.pat-body h5 { margin: 8px 0 2px; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); }
.pat-body p { margin: 0; color: var(--ink-2); }
.pill {
  display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--ink-2); background: var(--surface-2); margin: 2px 3px 0 0;
}
.strip { display: flex; gap: 14px; flex-wrap: wrap; align-items: baseline; margin-bottom: 12px; font-size: 11.5px; color: var(--ink-2); }
.strip b { font-size: 16px; font-weight: 650; color: var(--ink); }

/* ------------------------------------------------------------------ 3D/viewer */
.viewer-host { position: relative; flex: 1; min-height: 0; background: var(--surface-2); }
.viewer-host > iframe { width: 100%; height: 100%; border: 0; display: block; }
.viewer-msg {
  position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px;
  align-items: center; justify-content: center; text-align: center; padding: 24px;
  color: var(--ink-2); font-size: 12px;
}
.viewer-msg h3 { margin: 0; font-size: 14px; color: var(--ink); }
.viewer-msg p { margin: 0; max-width: 46ch; }

/* -------------------------------------------------------------- statusbar */
.statusbar {
  grid-area: status; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 5px 12px; border-top: 1px solid var(--rule); background: var(--surface);
  font-size: 11px; color: var(--ink-2); min-height: 28px;
}
.stat { display: inline-flex; gap: 5px; align-items: baseline; }
.stat b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.stat-err { color: var(--fail); font-weight: 600; max-width: 60vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge {
  font-size: 10px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--ink-2);
}
.badge-mock { background: var(--warn-wash); border-color: var(--warn); color: var(--ink); font-weight: 600; }
.warn-btn { background: none; border: 0; font: inherit; color: var(--serious); cursor: pointer; font-weight: 600; padding: 0; }
.warn-pop {
  position: absolute; bottom: 30px; right: 10px; z-index: 20; width: min(560px, 92vw); max-height: 42vh; overflow: auto;
  background: var(--surface); border: 1px solid var(--rule-2); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 8px 10px; font-size: 11.5px;
}
.warn-pop ol { margin: 4px 0 0; padding-left: 18px; }
.warn-pop li { margin-bottom: 3px; color: var(--ink-2); }

/* ---------------------------------------------------------------- spinner */
.spinner-wrap {
  position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; gap: 10px;
  align-items: center; justify-content: center; background: color-mix(in srgb, var(--plane) 72%, transparent);
  backdrop-filter: blur(1px);
}
.spinner {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2.5px solid var(--rule-2); border-top-color: var(--accent);
  animation: spin .7s linear infinite;
}
.spinner-msg { font-size: 12px; color: var(--ink-2); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }

/* ----------------------------------------------------------------- misc */
.empty { color: var(--ink-3); font-size: 12px; padding: 22px; text-align: center; }
.search { max-width: 260px; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 10.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }
.scroll-x { overflow-x: auto; }
.nowrap { white-space: nowrap; }
.tr-hl { background: var(--accent-wash) !important; }

</style>
</head>
<body data-backend="real">
<div id="app" class="app">
  <header class="hdr">
    <div class="hdr-id">
      <h1 class="hdr-title">Forma Residential <span class="hdr-arrow">→</span> IFC</h1>
      <p class="hdr-sub" id="subtitle">Loading…</p>
    </div>
    <div class="hdr-actions" id="hdr-actions">
      <button class="btn btn-primary" id="btn-generate" type="button">Generate</button>
      <button class="btn" id="btn-ifc" type="button">Download IFC</button>

 m in either direction, relax the setbacks proportionally and report it.",parameters:{frontSetback:{value:0,unit:"m",source:"typology.setbacks or spec.site.setbacks"},sideSetback:{value:0,unit:"m",source:"typology.setbacks or spec.site.setbacks"},rearSetback:{value:0,unit:"m",source:"typology.setbacks or spec.site.setbacks"},minEnvelopeDimension:{value:4,unit:"m",source:"default (smallest habitable bar)"}},references:["Alexander APL #104 Site Repair","Alexander APL #106 Positive Outdoor Space"]},{id:"SIT-02",name:"Building Faces the Street",discipline:"site",problem:"Buildings set back behind their parking, or rotated off the street line, kill the public realm: there are no eyes on the street, no visible front door, and none of the rhythm of entrances that makes a street legible.",solution:"Lay the principal bar with its long axis parallel to the street, on the front setback line (the build-to line). Put the main entrance on the front face at the first core, in the middle two thirds of the frontage. Give every direct-access dwelling its own door on the street face, one door per unit frontage, exported in order along +X so the architecture module can align unit doors to them. The number of doors is the number of HOUSES the bar actually holds, not a round frontage: divide the bar by the frontage the dominant template needs at this depth — its target area over the residential floors and the net bar depth (barDepth − 0.6), clamped to the template frontage band — so the row of front doors, the row of garage doors and the row of dwellings are the same row.",parameters:{buildToOffset:{value:0,unit:"m behind the front setback line",source:"default"},unitFrontage:{value:6,unit:"m",source:"fallback; normally area.target / (levels × (barDepth − 0.6)) from architecture/templates.ts"},externalWallPair:{value:.6,unit:"m",source:"2 × core/coordination.ts SIZES.exteriorWallT"},minFrontageDepthFactor:{value:.45,unit:"fraction",source:"floor of frontage.min × depth.max / netDepth (matches architecture)"},entranceZone:{value:"middle two thirds of the front face",source:"Alexander APL #110"}},dependsOn:["SIT-01"],references:["Alexander APL #122 Building Fronts","Alexander APL #110 Main Entrance"]},{id:"SIT-03",name:"Courtyard Which Lives",discipline:"site",problem:"Courtyards that are too small, too enclosed or with no route through them die: they are overlooked but never entered, in permanent shade, and become service yards.",solution:"Wrap the buildable envelope with bars one bar-depth thick to form a perimeter block, and keep the courtyard at least 15 m clear in BOTH directions so it receives sun at a 1:1 height-to-width ratio and reads as an outdoor room rather than a light well. Give it at least one passage through the street-facing bar (a courtyard entrance). If 15 m cannot be achieved, degrade the shape to a U so the court opens to the rear, and report it.",parameters:{minClearDimension:{value:15,unit:"m",source:"Alexander APL #115 + 1:1 H:W daylight rule at 5 storeys"},passages:{value:1,unit:"count",source:"Alexander APL #115 (a court must be crossed)"},degradeTo:{value:"U",source:"default"}},dependsOn:["SIT-01"],references:["Alexander APL #115 Courtyards Which Live","Alexander APL #106 Positive Outdoor Space"]},{id:"SIT-04",name:"South-Facing Garden",discipline:"site",problem:"The main garden ends up on whichever side the convention puts it — usually the rear — regardless of the sun. Half of all lots therefore get their good outdoor room on the shaded side, while the sunny strip is given to the driveway.",solution:"Score the front and rear exposures for solar quality (hemisphere taken from the region: AU and NZ flip the scores). If the street side is materially sunnier (score difference > 0.2) and the front setback can hold a usable garden (>= 4.5 m), push a direct-access building to the REAR of the buildable envelope so the main garden faces the sun; otherwise keep it on the front build-to line with the garden at the rear. The building never leaves the envelope — only its position inside it flips.",parameters:{scoreDelta:{value:.2,unit:"solar score (0..1)",source:"default"},minGardenDepth:{value:4.5,unit:"m",source:"default (usable outdoor room)"},southernHemisphere:{value:!1,source:"spec.region (AU / NZ)"}},dependsOn:["SIT-01"],references:["Alexander APL #105 South Facing Outdoors","Alexander APL #111 Half-Hidden Garden"]},{id:"SIT-05",name:"Back-of-Lot Dwelling",discipline:"site",problem:"A second dwelling added to an occupied lot has nowhere obvious to go. Put it beside the house and both lose their garden; put it in front and the street loses its rhythm.",solution:"Place the accessory dwelling hard against the rear setback line, its long face parallel to the lane, and keep at least 3 m of open separation between it and the notional main house at the front — narrowing the separation, never the dwelling, on a shallow lot. Emit the main house as context geometry (IfcBuildingElementProxy, objectType ExistingHouse, 7 m high) so the ADU reads at the right scale, and give the ADU its own door on the lane frontage so the main house keeps its address.",parameters:{separationMin:{value:3,unit:"m",source:"typical laneway / granny-flat bylaw separation"},notionalHouseHeight:{value:7,unit:"m",source:"default (2 storeys + roof)"},notionalHouseDepthMax:{value:9,unit:"m",source:"default"}},dependsOn:["SIT-01"],references:["Alexander APL #111 Half-Hidden Garden","Vancouver Laneway House Guidelines (siting principle)"]},{id:"SIT-06",name:"Active Street Wall",discipline:"site",problem:"In a city centre a setback is a gap. Gaps between buildings, and blank walls where the building steps back, break the continuity that makes a street feel like a room.",solution:"In urban context with a zero front setback, hold the ground floor on the back of the pavement across at least 70% of the frontage, with no parking, planting strip or driveway between the building line and the street. The remaining frontage may be an entrance recess or a courtyard passage.",parameters:{frontSetback:{value:0,unit:"m",source:"typology.setbacks (urban)"},buildToFraction:{value:.7,unit:"fraction of frontage",source:"default (form-based code typical)"}},dependsOn:["SIT-01","SIT-02"],references:["Alexander APL #122 Building Fronts","Form-based code build-to line conventions"]},{id:"SIT-07",name:"Parking Behind",discipline:"site",problem:"A car park between the building and the street destroys the frontage: it puts 25 m² of asphalt per dwelling exactly where the front garden and the front door should be, and every arrival is across a parking aisle.",solution:"Never put surface parking in the front yard while another yard can hold it. Test the rear yard first, then the side yards, and the front only as a last resort. Lay stalls 2.6 x 5.4 m in double-loaded rows off a single 6.0 m aisle (module 16.8 m), reserve 5% of stalls as accessible at 3.6 m wide, flag the EV share, and screen the lot from the street with the planting strip. Structured parking (podium / underground) instead fills the parking storey outline with the same module and takes one 3.5 m ramp at the rear.",parameters:{stallWidth:{value:2.6,unit:"m",source:"core/coordination.ts SIZES.parkingStallW"},stallLength:{value:5.4,unit:"m",source:"core/coordination.ts SIZES.parkingStallL"},aisleWidth:{value:6,unit:"m",source:"core/coordination.ts SIZES.parkingAisleW (two-way)"},doubleLoadedModule:{value:16.8,unit:"m",source:"5.4 + 6.0 + 5.4"},accessibleShare:{value:.05,unit:"fraction",source:"IBC 2021 Table 1106.1 (~4%), rounded up to 5%"},accessibleWidth:{value:3.6,unit:"m",source:"ADA / IBC 1106 car space + access aisle"},rampWidth:{value:3.5,unit:"m",source:"default (one-way ramp)"}},dependsOn:["SIT-01","SIT-02"],references:["Alexander APL #97 Shielded Parking","Alexander APL #103 Small Parking Lots","Alexander APL #113 Car Connection"]},{id:"SIT-08",name:"Two Ways Out",discipline:"site",problem:"One stair is cheap, but it traps everyone above the fire. Too many cores is the opposite waste: each one eats 20 m² of frontage per floor and cuts the corridor into stubs.",solution:"Size the core rectangle from what it has to hold, not from a round number: along the bar, 2.6 m for two 1.1 m stair flights plus 2.4 m for the service shaft bay (combined M/E riser and refuse chute) = 5.0 m; across the bar, one dog-leg stair run for the TALLEST floor-to-floor (ceil(risers/2) treads of 0.28 m plus a 1.2 m half-landing) plus a 2.3 m lift bank where there are lifts plus a 1.2 m lift lobby. Allow a single core only where the floor has at most 4 units and the building is at most 3 storeys. On a corridor, place at least two cores, spaced so travel to the nearest never exceeds the limit (61 m unsprinklered, 76 m sprinklered) and the exits are at least a third of the plan diagonal apart, each at least 6 m from a bar end and flush against one side of the corridor so the corridor stays continuous. On a stair-core block there is no corridor to space cores along, so count them by the frontage MODULE each landing needs — core + landing + the unit frontages it serves on both sides — and put each core at the centre of its module, so every landing gets the same frontage on both sides.",parameters:{travelLimitSprinklered:{value:76,unit:"m",source:"IBC 2021 Table 1017.2 (Group R, sprinklered, 250 ft)"},travelLimitUnsprinklered:{value:61,unit:"m",source:"IBC 2021 Table 1017.2 (Group R, 200 ft)"},singleExitMaxUnitsPerFloor:{value:4,unit:"count",source:"IBC 2021 §1006.3.3 / Table 1006.3.3 (R-2 single exit)"},singleExitMaxStoreys:{value:3,unit:"count",source:"IBC 2021 Table 1006.3.3"},exitSeparationFraction:{value:.3333,unit:"fraction of plan diagonal",source:"IBC 2021 §1007.1.1 exc. 2 (sprinklered)"},endClearance:{value:6,unit:"m",source:"default (keep the end bay usable for a dual-aspect unit)"},coreWidthAlongBar:{value:5,unit:"m",source:"2.6 m stair bay + 2.4 m shaft bay (XD-04)"},stairBayAlongBar:{value:2.6,unit:"m",source:"two 1.1 m flights (SIZES.stairWidth) side by side, IBC 2021 §1011.2"},shaftBayAlongBar:{value:2.4,unit:"m",source:"XD-04: combined M/E riser 1.2 × 0.8 + refuse chute 1.0 × 1.0"},riserMax:{value:.175,unit:"m",source:"IBC 2021 §1011.5.2 / ADB vol.1 (dwellings)"},treadMin:{value:.28,unit:"m",source:"core/coordination.ts SIZES.stairTreadMin"},stairHalfLanding:{value:1.2,unit:"m",source:"default (landing at least the flight width)"},liftBankDepth:{value:2.3,unit:"m",source:"core/coordination.ts SIZES.elevatorShaftD + structure"},liftLobbyDepth:{value:1.2,unit:"m",source:"default (accessible lobby in front of the bank)"},landingStairCore:{value:2.4,unit:"m",source:"default (walk-up landing beside the stair)"},landingMansionBlock:{value:2.6,unit:"m",source:"default (mansion-block entrance hall)"}},dependsOn:["SIT-09"],references:["IBC 2021 §1006 Number of exits","IBC 2021 §1017 Exit access travel distance","IBC 2021 §1011 Stairways","Approved Document B vol.1 (UK) 30 m common corridor","NCC 2022 Vol.1 D2 (AU)"]},{id:"SIT-09",name:"Bar Depth from Unit Depth",discipline:"site",problem:"Bar depth is usually chosen for efficiency, and the units are then squeezed into whatever is left. Too shallow and the building is all facade; too deep and every living room is a tunnel with one window at the far end.",solution:"Derive bar depth from the unit depth and the access type: double-loaded corridor = 2 x unit depth + corridor width; single-loaded or gallery = 1 x unit depth + gallery width; point plate = core depth + 2 x unit depth. Run the rule backwards on the specified depth to get the implied unit depth, and report it; flag depths that imply a unit shallower than 6.5 m or deeper than 14 m (beyond which the back of the plan has no daylight).",parameters:{unitDepthMin:{value:6.5,unit:"m",source:"default (minimum workable unit depth)"},unitDepthMax:{value:14,unit:"m",source:"daylight: habitable depth <= 2.5 x ceiling height"},corridorWidth:{value:1.7,unit:"m",source:"typology.corridorWidth / spec.mass ToStack:{value:3,unit:"m",source:"IPC 2021 Table 1002.2 trap-arm length"}},dependsOn:["XD-01"],references:["IPC 2021 §1002","BS EN 12056-2","Alexander APL #197 Thick Walls"]},{id:"ARC-15",name:"Furniture Fits",discipline:"architecture",problem:"A room that meets an area minimum can still be unusable: a 2.4 m wide bedroom takes a double bed and leaves no way past it, and a 1.5 m wide kitchen cannot open a dishwasher.",solution:"Size every room from the furniture it must hold plus its clearances, not from area alone. Double bedroom = bed 1.37 × 1.9 + 0.75 m access on both long sides + 0.7 m at the foot → 2.75 m minimum clear width and 11.5 m². Single bedroom = 0.99 × 1.9 bed + 0.75 m one side → 2.15 m and 7.5 m². Kitchen = 0.6 m counter + 1.2 m aisle → 1.8 m one-sided, 2.4 m with appliances opposite. Bathroom = WC 0.4 × 0.7 with 0.75 m clear in front and 0.4 m to the centreline from a side wall, basin 0.6, shower 0.9 × 0.9 → 1.7 × 2.2 m, 3.7 m². Dining = 0.6 m of table edge per person + 0.75 m chair pull-out.",parameters:{doubleBedroomMinWidth:{value:2.75,unit:"m",source:"London Plan 2021 Housing Design Standards LPG Table 3.1"},doubleBedroomMinArea:{value:11.5,unit:"m²",source:"London Plan 2021 LPG Table 3.1"},singleBedroomMinWidth:{value:2.15,unit:"m",source:"London Plan 2021 LPG Table 3.1"},singleBedroomMinArea:{value:7.5,unit:"m²",source:"London Plan 2021 LPG Table 3.1"},habitableRoomMinArea:{value:6.5,unit:"m²",source:"IRC 2021 R304.1 (70 sq ft)"},bedSideClearance:{value:.75,unit:"m",source:"default (Neufert)"},kitchenAisle:{value:1.2,unit:"m",source:"default; 1.5 m where accessible"},bathroomMinArea:{value:3.7,unit:"m²",source:"default (1.7 × 2.2 three-piece)"}},references:["London Plan 2021 Policy D6","Technical Housing Standards (NDSS) 2015 Table 1","IRC 2021 R304","Neufert, Architects’ Data 5th ed."]},{id:"ARC-16",name:"Windows by Wall Ratio",discipline:"architecture",problem:"Windows drawn by eye either under-light deep rooms or over-glaze a façade until it cannot meet an energy target, and a sill at the wrong height blocks the view when you are sitting down.",solution:"Give each room a share of its exterior wall proportional to its frontage, then glaze that share to the floor's window-to-wall ratio: window area = WWR × (room wall length × floor-to-floor). Split the result into 0.9–2.4 m wide openings centred on the room's wall span, head at 2.3 m, sill 0.9 m — dropped to 0.6 m in living rooms when the WWR is above 0.4 so that a seated person sees the ground.",parameters:{wwrDefault:{value:.35,unit:"ratio",source:"spec.floors[].wwr"},windowHeight:{value:1.4,unit:"m",source:"SIZES.windowHeight"},sillDefault:{value:.9,unit:"m",source:"SIZES.windowSill"},sillLowLiving:{value:.6,unit:"m",source:"default when wwr > 0.4"},widthMin:{value:.9,unit:"m",source:"default"},widthMax:{value:2.4,unit:"m",source:"default (manufacturable single sash/lift)"},minGlazingOfFloorArea:{value:.08,unit:"ratio",source:"IRC 2021 R303.1 (8% of floor area)"}},references:["IRC 2021 R303.1","Approved Document L 2021","NCC 2022 Part 3.12","Alexander APL #221 Natural Doors and Windows"]},{id:"ARC-17",name:"Balcony as Outdoor Room",discipline:"architecture",problem:"Balconies less than about 1.8 m deep are never used: there is no room for a table and two chairs, and anyone sitting on them feels exposed to the street.",solution:"Make the private outdoor space at least 1.8 m deep and at least 1.5 m² per bedspace, hang it off the living room, and open it with a 1.8 m sliding door so the inside and the outside read as one room. Furnish it with a table and two chairs to prove it works.",parameters:{minDepth:{value:1.8,unit:"m",source:"Alexander APL #167 Six-Foot Balcony"},minArea1b:{value:5,unit:"m²",source:"London Plan 2021 Policy D6 (5 m² for 1–2 person dwellings)"},areaPerExtraPerson:{value:1,unit:"m²",source:"London Plan 2021 Policy D6"},doorWidth:{value:1.8,unit:"m",source:"default sliding pair"}},references:["Alexander APL #167","London Plan 2021 Policy D6","NCC 2022 Part 3.9 (balustrade 1.0 m)"]},{id:"ARC-18",name:"Entry Hall Transition",discipline:"architecture",problem:"A front door opening straight into the living room gives no place to put down shopping, hang a coat or stand while the door is open, and it exposes the whole dwelling to the corridor.",solution:"Hold a transition space 1.2–1.8 m wide and at least 2 m² immediately inside the entry door, with a bench and a coat closet, and let it be the room that distributes to everything else. Never let the entry door swing collide with an internal door.",parameters:{minWidth:{value:1.2,unit:"m",source:"default"},minArea:{value:2,unit:"m²",source:"default"},entryDoorWidth:{value:.9,unit:"m",source:"SIZES.doorUnitEntry"},clearFloorInside:{value:1.5,unit:"m",source:"ADA 2010 §404.2.4 manoeuvring clearance (accessible units)"}},references:["Alexander APL #112 Entrance Transition","Alexander APL #130 Entrance Room","ADA 2010 §404"]},{id:"ARC-19",name:"Bedroom Privacy Gradient",discipline:"architecture",problem:"When bedrooms open off the living room, nobody can sleep while anyone else is awake, and a visitor at the door sees straight into the most private part of the home.",solution:"Order the plan along the intimacy gradient: entry, then the public rooms, then a hall, then the bedrooms at the far end of the frontage from the front door. Put the bathrooms and closets between the hall and the bedrooms so no bedroom shares a wall with a living space.",parameters:{hallWidth:{value:1.2,unit:"m",source:"default (0.9 m clear minimum + door architraves)"},minHallWidthAccessible:{value:1.2,unit:"m",source:"ADA 2010 §403.5.1 (0.915 m) + turning space"},bedroomsFromEntry:{value:"farthest",source:"Alexander APL #127"}},references:["Alexander APL #127 Intimacy Gradient","Alexander APL #141 A Room of One’s Own"]},{id:"ARC-20",name:"Kitchen Work Triangle",discipline:"architecture",problem:"A kitchen laid out as a line of cabinets with the fridge at the wrong end makes every meal a walk, and a sink far from the wet wall drags waste pipes across the floor.",solution:"Put the sink on the wet wall, the range in the same run at least 0.6 m from it, and the fridge at the end of the run nearest the entry. Keep the sum of the three legs between 4 and 8 m, with no leg under 1.2 m, and keep a 1.2 m aisle (1.5 m where accessible) clear in front of the run. The dishwasher goes immediately beside the sink.",parameters:{triangleMin:{value:4,unit:"m",source:"NKBA Kitchen Planning Guideline 5"},triangleMax:{value:8,unit:"m",source:"NKBA Kitchen Planning Guideline 5"},counterDepth:{value:.6,unit:"m",source:"default (600 mm module)"},aisle:{value:1.2,unit:"m",source:"NKBA Guideline 6 (1.07 m one-cook minimum)"},aisleAccessible:{value:1.5,unit:"m",source:"ADA 2010 §804.2.2 U-shaped / turning space"},sinkToRangeMin:{value:.6,unit:"m",source:"default landing area"}},dependsOn:["ARC-14"],references:["NKBA Kitchen Planning Guidelines","ADA 2010 §804","Alexander APL #184 Cooking Layout"]},{id:"ARC-21",name:"Bathroom Back-to-Back",discipline:"architecture",problem:"Two bathrooms on opposite sides of a unit need two stacks, two vent penetrations and twice the hot-water run, and a bathroom that shares a partition with a bedroom transmits every flush.",solution:"Pair bathrooms and the kitchen along the same wet wall so their fixtures stand back to back on one 0.2 m wall carrying one stack. Where a bathroom must touch a bedroom, put a closet or the bath tub itself against the shared wall instead of the WC.",parameters:{sharedWallThickness:{value:.2,unit:"m",source:"SIZES.wetWallT"},maxFixtureToStack:{value:3,unit:"m",source:"IPC 2021 Table 1002.2"},acousticTarget:{value:45,unit:"dB DnT,w",source:"Approved Document E Table 1 (walls between dwellings 45 dB)"}},dependsOn:["ARC-14","XD-01"],references:["IPC 2021 §905 (vent connections)","Approved Document E","ASTM E336"]},{id:"ARC-22",name:"Stacked Stair in Multi-Level Units",discipline:"architecture",problem:"An internal stair drawn separately on each floor of a maisonette or townhouse lands in a different place upstairs, so the floor opening does not line up, the structure cannot span and the headroom fails.",solution:"Fix one stair footprint against a party wall near the entry and repeat it identically on every level of the unit, with the floor opening above it and a landing at the head. Risers = round(floor-to-floor / 0.18), going 0.26 m, clear width 1.0 m, headroom 2.0 m.",parameters:{riserMax:{value:.18,unit:"m",source:'SIZES.stairRiserMax; IRC 2021 R311.7.5.1 (7¾" = 0.196 m), ADM K 0.22 max'},going:{value:.26,unit:"m",source:'IRC 2021 R311.7.5.2 (10" = 0.254 m min); Approved Document K 0.22 m min'},clearWidth:{value:1,unit:"m",source:"IRC 2021 R311.7.1 (0.91 m); Approved Document K (0.8 m)"},headroom:{value:2,unit:"m",source:"IRC 2021 R311.7.2 (6′8″ = 2.03 m); Approved Document K 2.0 m"},identicalRectEveryLevel:{value:!0,source:"default"}},references:["IRC 2021 R311.7","Approved Document K 2013","NCC 2022 Part 3.9.1"]},{id:"ARC-23",name:"Universal Design Unit",discipline:"architecture",problem:"A dwelling that a wheelchair user cannot turn around in, or whose bathroom door is 0.76 m wide, excludes its occupant the day their mobility changes — and most of the cost of fixing it later is demolition.",solution:"Where the template is accessible: every door 0.9 m clear, a 1.5 m turning circle clear of fixtures in the entry, kitchen and bathroom, a level-threshold roll-in shower 1.5 × 0.9 m with a folding seat, grab rails beside the WC and in the shower, 1.2 m of clear floor in front of every appliance, and worktops and switches within the 0.4–1.2 m reach range.",parameters:{doorClearWidth:{value:.9,unit:"m",source:"ADA 2010 §404.2.3 (0.815 m clear); ADM M4(3) 0.9 m leaf"},turningCircle:{value:1.5,unit:"m",source:"ADA 2010 §304.3.1; ADM M4(2) 1.5 m"},rollInShower:{value:"1.5 × 0.9",unit:"m",source:"ADA 2010 §608.2.2"},grabRailHeight:{value:.85,unit:"m",source:"ADA 2010 §609.4 (0.84–0.92 m)"},wcSideClearance:{value:.45,unit:"m",source:"ADA 2010 §604.2 (0.41–0.46 m to centreline)"},reachRange:{value:"0.38–1.22",unit:"m",source:"ADA 2010 §308"}},references:["ADA 2010 §603, §604, §608","Approved Document M4(2)/M4(3)","AS 1428.1-2009","ANSI A117.1 Type A"]},{id:"ARC-24",name:"Cluster Around a Shared Hearth",discipline:"architecture",problem:"Shared housing built as a corridor of bedrooms with a token kitchen produces no shared life at all: the kitchen is a passage, and residents retreat to their rooms.",solution:"Give a cluster of five or six en-suite rooms one big shared kitchen/living room at the daylit end of the plan, big enough to eat in together — 6–7 m² per resident, a table for everyone, and the cooking run in the same room rather than behind a wall. Reach the rooms from a short internal corridor off the front door, never through the shared room.",parameters:{roomsPerCluster:{value:6,unit:"rooms",source:"default (5–8 typical for UK cluster flats)"},sharedAreaPerResident:{value:7,unit:"m²/person",source:"default (42 m² shared for 6)"},bedroomArea:{value:13.5,unit:"m²",source:"default; ≥ 12 m² en-suite study bedroom"},corridorWidth:{value:1.2,unit:"m",source:"default (0.9 m clear + architraves)"},diningSeats:{value:6,unit:"seats",source:"occupancy"}},dependsOn:["ARC-29"],references:["Alexander APL #139 Farmhouse Kitchen","Alexander APL #37 House Cluster","London Plan 2021 Policy H16 (large-scale purpose-built shared living)"]},{id:"ARC-25",name:"Dual-Key Vestibule",discipline:"architecture",problem:"A flat that has to work as either one home or two needs two front doors, but two doors off the corridor doubles the corridor length per dwelling and halves the letting flexibility.",solution:"One door from the corridor into a small shared vestibule, then two lockable doors: one into the main flat and one into a self-contained studio with its own shower room and kitchenette. The studio takes a full-depth slice at one end of the frontage so both halves keep a window wall, and the vestibule sits on the boundary between them.",parameters:{vestibuleArea:{value:3.5,unit:"m²",source:"default"},vestibuleMinWidth:{value:1.3,unit:"m",source:"default (two door swings)"},studioShare:{value:.32,unit:"ratio of unit area",source:"default"},lockableDoors:{value:2,unit:"doors",source:"default"}},dependsOn:["ARC-18"],references:["IBC 2021 §420 (R-2 dwelling/sleeping unit separation)","Approved Document E (separating walls between dwellings)"]},{id:"ARC-26",name:"Living at the Corner",discipline:"architecture",problem:"In a corner or dual-aspect unit the plan usually gives the corner to a bedroom because it packs better, and the living room ends up single-aspect and dark for half the day.",solution:"When a unit has two exterior sides, put the living room in the corner so it takes light from both, and let the bedrooms share the longer façade. Every room then has daylight from at least one side and the main room from two, which also lets the unit cross-ventilate.",parameters:{exteriorSidesRequired:{value:2,unit:"sides",source:"default"},livingAtCorner:{value:!0,source:"Alexander APL #159"},crossVentilation:{value:!0,source:"CIBSE TM59 / NCC 2022 Part 3.12.1"}},references:["Alexander APL #159 Light on Two Sides of Every Room","Alexander APL #128 Indoor Sunlight","London Plan 2021 (dual-aspect preference)"]},{id:"ARC-27",name:"Closet Buffer Between Bedrooms",discipline:"architecture",problem:"Two bedrooms sharing a single 0.12 m partition hear each other, and a bedroom next to a bathroom hears the shower and the WC.",solution:"Where two bedrooms or a bedroom and a bathroom meet, put a wardrobe run or a closet against the shared wall, so the acoustic path gains a mass layer and 0.6 m of air. Where a closet is not available, place the wardrobe (1.2 × 0.6) on the shared wall rather than the bed head.",parameters:{bufferDepth:{value:.6,unit:"m",source:"wardrobe depth"},partitionThickness:{value:.12,unit:"m",source:"SIZES.partitionT"},internalWallTarget:{value:40,unit:"dB Rw",source:"Approved Document E Table 2 (internal walls 40 dB)"}},references:["Approved Document E Table 2","IBC 2021 §1206 (STC 45/50 between dwelling units)","Alexander APL #141"]},{id:"ARC-28",name:"Door Swings Clear",discipline:"architecture",problem:"Doors drawn without their swings collide with each other in halls, open onto WCs you cannot then close the door behind, and hit furniture or light switches.",solution:"Reserve a quarter-circle of the door's own width in front of every swing door and keep it free of other door swings, of furniture and of fixtures. Keep every door leaf at least 0.15 m from a corner so the architrave and the handle have somewhere to land, and use a sliding or cased opening where a swing cannot be kept clear.",parameters:{swingClearance:{value:"door width × door width",source:"default"},minFromCorner:{value:.15,unit:"m",source:"default"},interiorDoorWidth:{value:.8,unit:"m",source:"SIZES.doorInterior"},bathroomDoorWidth:{value:.75,unit:"m",source:"SIZES.doorBathroom"},closetDoorWidth:{value:.7,unit:"m",source:"default"},accessibleDoorWidth:{value:.9,unit:"m",source:"ADA 2010 §404.2.3"}},references:["ADA 2010 §404.2.4 (manoeuvring clearances)","IRC 2021 R311.2","Approved Document M Table 2"]},{id:"ARC-29",name:"Occupancy Sets the Table",discipline:"architecture",problem:"Dining areas sized by leftover space seat four people in a home designed for six, and living rooms get a three-seat sofa whether one person lives there or five.",solution:"Derive the eating and sitting furniture from the design occupancy: 0.6 m of table edge per person (a 1.2 × 0.8 table to 4, a 1.8 × 0.9 table to 6) plus 0.75 m of chair pull-out all round; seats in the living room ≥ occupancy, so a 1–2 person home gets a two-seat sofa and a 5–6 person home a three-seat sofa plus an armchair.",parameters:{tableEdgePerPerson:{value:.6,unit:"m/person",source:"default (Neufert)"},chairPullOut:{value:.75,unit:"m",source:"default"},seatsMin:{value:"occupants",source:"XD-05"},occupancyRule:{value:"bedspaces = 2 per double bedroom, 1 per single",source:"XD-05 / London Plan 2021"}},dependsOn:["XD-05"],references:["London Plan 2021 LPG Table 3.1 (areas by bedspaces)","ASHRAE 62.2-2019 §4.1.2 (bedrooms + 1)","Alexander APL #147 Communal Eating"]},{id:"ARC-30",name:"Storage per Occupant",discipline:"architecture",problem:"Dwellings built without built-in storage fill their circulation and their bedrooms with wardrobes and boxes, and the plan that looked generous on paper becomes unusable in a year.",solution:"Provide at least 0.6 m³ of enclosed storage per occupant and 2.5 m² of built-in storage floor area for a 1–2 person home plus 0.5 m² per extra person: a coat closet at the entry, a wardrobe (1.2 × 0.6 × 2.1 = 1.5 m³) per bedroom, a linen closet on the bedroom hall, and a utility store for bulky items.",parameters:{volumePerOccupant:{value:.6,unit:"m³/person",source:"default"},builtInArea1to2p:{value:2.5,unit:"m²",source:"London Plan 2021 LPG Table 3.1 / NDSS 2015"},areaPerExtraPerson:{value:.5,unit:"m²/person",source:"NDSS 2015 Table 1"},wardrobeVolume:{value:1.5,unit:"m³",source:"1.2 × 0.6 × 2.1 wardrobe"},minClosetWidth:{value:.6,unit:"m",source:"default (hanging rail depth 0.6)"}},references:["Technical Housing Standards (NDSS) 2015 Table 1","London Plan 2021 LPG 3.1","Alexander APL #145 Bulk Storage"]},{id:"ARC-36",name:"Through Flat: Two Faces, One Hall",discipline:"architecture",problem:"A dwelling entered from a stair landing on its side — two flats per core in a mansion block or a garden walk-up — has a party wall opposite its front door, so a plan that puts the daylit rooms on the far side of the unit hands every bedroom a blank wall. The rooms that need light are then lit from the one thing that cannot carry a window, and the deep middle of the plan has nowhere to put a corridor.",solution:"Turn the plan through ninety degrees. Run a hall 1.1–1.5 m deep along the landing wall, straight in pline:"architecture",problem:"A dwelling reached through a shared lobby, a corridor and a lift has no address. Nobody feels responsible for the ground in front of it, and the street loses the small daily transactions — arriving, leaving, sweeping the step — that make it feel inhabited.",solution:"For direct-access typologies give every dwelling its own door on the street face, at the X position of the matching site entrance, raised a step or two above the footway and set back behind a shallow threshold (porch, stoop or gated forecourt). Party walls set the rhythm of doors; no dwelling is entered through another dwelling.",parameters:{doorWidth:{value:.9,unit:"m",source:"default (ADA 815 mm clear / Part M 800 mm clear)"},doorHeight:{value:2.1,unit:"m",source:"default"},thresholdDepth:{value:1.2,unit:"m",source:"Alexander APL #112 Entrance Transition"},entrancesPerDwelling:{value:1,unit:"count",source:"typology access = direct"}},references:["Alexander, A Pattern Language #102 Family of Entrances, #110 Main Entrance","IBC 2021 §1010"]},{id:"ARC-02",name:"Party Wall Rhythm",discipline:"architecture",problem:"When dwellings are packed at arbitrary widths, the facade loses rhythm, the structure has no repeating line to follow, and no two floors stack. Every plan becomes a one-off.",solution:"Pick one unit module (the frontage) and repeat it. Party walls land on that module; every structural grid line, every downpipe and every window bay is a multiple of it. Corner and remnant bays absorb the leftover, never the typical bay.",parameters:{moduleTownhouse:{value:6,unit:"m",source:"typology townhouse-row frontage 5.5–6.5"},moduleApartment:{value:7.2,unit:"m",source:"template frontage = area / depth"},partyWallThickness:{value:.25,unit:"m",source:"SIZES.partyWallT (twin stud, acoustically isolated)"},acousticRating:{value:"STC 55",source:"IBC 2021 §1206.2 (STC 50 min), Approved Document E (DnT,w 45 dB)"}},dependsOn:["ARC-01"],references:["IBC 2021 §1206","Approved Document E","Alexander APL #205 Structure Follows Social Spaces"]},{id:"ARC-03",name:"Double-Loaded Corridor with Light at the Ends",discipline:"architecture",problem:"A long internal corridor with units on both sides is the cheapest way to reach many dwellings and the bleakest. With no daylight and no end in sight it becomes a tunnel, and residents stop meeting in it.",solution:"Run the corridor down the middle of the bar and break it into legs no longer than 45 m. Put a window, a lift lobby or a stair with a window at each end and at each break, so from anywhere in the corridor you can see daylight. Widen the corridor at the lift lobbies so waiting does not block passing.",parameters:{corridorWidth:{value:1.7,unit:"m",source:"typology corridorWidth (IBC 2021 §1020.2 min 1120 mm)"},maxLegLength:{value:45,unit:"m",source:"default (daylight at both ends)"},maxCorridorLength:{value:60,unit:"m",source:"warn threshold"},corridorWallThickness:{value:.2,unit:"m",source:"SIZES.corridorWallT (1HR rated)"},corridorFireRating:{value:"1HR",source:"IBC 2021 Table 1020.1 (sprinklered R-2)"}},dependsOn:["ARC-04"],references:["IBC 2021 §1020","Alexander APL #131 The Flow Through Rooms, #132 Short Passages"]},{id:"ARC-04",name:"Core as Anchor",discipline:"architecture",problem:"Stairs, lifts, risers and refuse chutes placed wherever they fit puncture every floor in a different place, force transfer structure, and leave residents hunting for the way out.",solution:"Gather the stair, the lift bank, the lift lobby and the service shafts into one rectangular core that repeats identically on every storey. The core is the only element that never moves; everything else is organised around it. Core walls are concrete or twin-rated, 2-hour, and load-bearing.",parameters:{coreWallThickness:{value:.25,unit:"m",source:"SIZES.coreWallT"},coreFireRating:{value:"2HR",source:"IBC 2021 Table 1023.2 (4+ storeys → 2 h enclosure)"},stairWidth:{value:1.1,unit:"m",source:"SIZES.stairWidth (IBC §1011.2 1120 mm sprinklered)"},elevatorShaft:{value:"2.0 x 2.2",unit:"m",source:"SIZES.elevatorShaftW/D"},liftLobbyDepth:{value:1.6,unit:"m",source:"default (ASME A17.1 / BS 8300 waiting area)"}},references:["IBC 2021 §1023","ASME A17.1","Alexander APL #158 Open Stairs"]},{id:"ARC-05",name:"Corner Units Dual Aspect",discipline:"architecture",problem:"The ends of a double-loaded bar are the best real estate in the building — light from two directions, cross-ventilation, a view along two streets — and they are routinely wasted on a single-aspect studio or a store cupboard.",solution:"Reserve the two ends of every bar for the largest dual-aspect template in the mix (corner-2b2b if present). Give it the full bar depth and windows on both exterior faces, and put its living room in the corner itself.",parameters:{cornerTemplate:{value:"corner-2b2b",source:"unit mix (falls back to the largest template)"},exteriorSidesPerCornerUnit:{value:2,unit:"count",source:"geometry"},minCornerFrontage:{value:7.5,unit:"m",source:"template frontage.min"}},dependsOn:["ARC-03"],references:["Alexander APL #159 Light on Two Sides of Every Room","London Housing Design Guide 2.3.1"]},{id:"ARC-06",name:"Light on Two Sides of Every Room",discipline:"architecture",problem:"Rooms lit from one side alone are read as gloomy whatever the lux level, because the eye judges brightness by the contrast between a wall and the window beside it. Deep single-aspect plans make every room a tunnel.",solution:"Keep the habitable depth from a window no greater than 2.5 times the floor-to-ceiling height, prefer dual-aspect and corner units, and pass the wwr target and the exterior sides to the unit layout so it can put the living space where two walls have glass.",parameters:{maxRoomDepthToCeilingRatio:{value:2.5,unit:"ratio",source:"daylight rule of thumb (BS 8206-2)"},wwrTarget:{value:.35,unit:"ratio",source:"FloorSpec.wwr"},maxSingleAspectDepth:{value:9,unit:"m",source:"London Housing SPG (single aspect ≤ 9 m)"}},dependsOn:["ARC-05"],references:["Alexander, A Pattern Language #159","BS 8206-2","London Housing SPG 2016"]},{id:"ARC-07",name:"Two per Landing",discipline:"architecture",problem:"Past about four doors a landing stops being a shared front step and becomes a corridor: neighbours are strangers, the space is anonymous, and no dwelling can be dual aspect.",solution:"Serve 2 (mansion block) or 4 (walk-up) dwellings from each stair landing, one on each side of the core, each spanning the full depth of the bar so every dwelling has windows front and back. The landing is 2.4 m deep, daylit where possible, and no dwelling is more than a few steps from it.",parameters:{unitsPerCore:{value:2,unit:"count",source:"typology unitsPerCore"},landingDepth:{value:2.4,unit:"m",source:"default (IBC §1011.6 landing ≥ stair width)"},maxDoorsPerLanding:{value:4,unit:"count",source:"Alexander APL #37 House Cluster"}},dependsOn:["ARC-04"],references:["Alexander APL #37 House Cluster","IBC 2021 §1011.6"]},{id:"ARC-08",name:"Typical Floor Repeats",discipline:"architecture",problem:"If every floor is planned freshly, wet walls miss each other between storeys, risers zigzag, structure needs transfers and the building costs a third more to build for no benefit to anyone living in it.",solution:"Plan ONE typical residential floor and repeat it on every residential storey: identical unit rectangles, identical templates, identical wet-wall positions, identical shaft positions. Only the ground floor, the podium and the roof differ.",parameters:{typicalFloorsShared:{value:1,unit:"plan per (use, outline, mix)",source:"default"},stackToleranceXY:{value:0,unit:"m",source:"exact repetition"}},dependsOn:["ARC-03","ARC-04"],references:["XD-01 Wet Wall Stacking","XD-03 Structure Follows Party Walls"]},{id:"ARC-09",name:"Cross-Ventilation Single-Loaded",discipline:"architecture",problem:"A double-loaded bar gives half its dwellings a single aspect, no through breeze and a hot side in summer. In a warm climate that means mechanical cooling for everyone.",solution:"Load the corridor on one side only and put the access on an open gallery or deck outside the envelope. Every dwelling then spans the bar and has openable windows on two opposite faces, giving a stack-and-breeze path across the plan. The deck gets a 1.1 m railing and doubles as a shared balcony.",parameters:{galleryWidth:{value:1.5,unit:"m",source:"typology corridorWidth"},railingHeight:{value:1.1,unit:"m",source:"IBC 2021 §1015.3 (1067 mm) / AS 1170.1"},crossVentOpeningRatio:{value:.05,unit:"ratio of floor area per face",source:"ASHRAE 62.2 / AS 1668.4"},dualAspectShare:{value:1,unit:"ratio",source:"geometry (all units dual aspect)"}},dependsOn:["ARC-03"],references:["Alexander APL #159","CIBSE AM10"]},{id:"ARC-10",name:"Public Front / Private Back",discipline:"architecture",problem:"A house with no gradient from street to garden has nowhere to receive a stranger and nowhere to be unobserved. Either the living room is on show or the front door opens straight into it.",solution:"Organise every house along one axis: street, threshold, entry and the formal rooms at the front; kitchen, family space and the garden at the back; bedrooms above the back. Service rooms and the stair sit on the party wall, out of the daylight.",parameters:{frontZoneDepth:{value:4.5,unit:"m",source:"default (front room depth)"},rearZoneDepth:{value:5.5,unit:"m",source:"default (kitchen-dining to garden)"},entryThresholdDepth:{value:1.2,unit:"m",source:"Alexander APL #112"}},dependsOn:["ARC-01"],references:["Alexander, A Pattern Language #127 Intimacy Gradient, #112 Entrance Transition"]},{id:"ARC-11",name:"Garage as Side Wing",discipline:"architecture",problem:"A garage pushed to the front centre of a house turns the street elevation into a door for a car, buries the front door and kills the habitable frontage.",solution:"Put the garage in the end bay of the frontage, recessed behind the plane of the front door, with the habitable rooms and the entry holding the street. The garage is a single 2.6 m leaf, 6 m deep, with a direct door into the hall.",parameters:{garageDoorWidth:{value:2.6,unit:"m",source:"default (single car)"},garageDoorHeight:{value:2.2,unit:"m",source:"default"},garageDepth:{value:6,unit:"m",source:"SIZES.parkingStallL + clearance"},recessFromFrontDoor:{value:.6,unit:"m",source:"default"}},dependsOn:["ARC-10"],references:["Alexander APL #113 Car Connection"]},{id:"ARC-12",name:"Cluster Around a Shared Hearth",discipline:"architecture",problem:"Co-living reduced to a corridor of bedsits gives its residents neither privacy nor company: the shared kitchen is a leftover at the end of the hall and nobody uses it.",solution:"Group 4–8 private ensuite rooms into one cluster that has its own front door, and put the shared kitchen-living at the heart of the cluster where every room passes through it. The cluster takes a large frontage on the corridor, and building-wide amenity sits on the ground floor.",parameters:{roomsPerCluster:{value:6,unit:"count",source:"template coliving-cluster"},clusterFrontage:{value:14,unit:"m",source:"template frontage.max"},sharedAreaPerResident:{value:4,unit:"m²/person",source:"UK HMO / co-living guidance"}},dependsOn:["ARC-03"],references:["Alexander APL #37 House Cluster, #129 Common Areas at the Heart"]},{id:"ARC-13",name:"Universal Corridor",discipline:"architecture",problem:"Standard corridors and doorways defeat a walking frame, a wheelchair or a stretcher. In senior housing that turns an ordinary day into a series of obstacles and a fall into an emergency.",solution:"Widen corridors to 2.0 m so two wheelchairs pass and a resident can rest, use 0.9 m clear door leaves with lever hardware throughout, keep thresholds flush, and put a handrail and continuous even lighting along both corridor walls.",parameters:{corridorWidth:{value:2,unit:"m",source:"typology senior-living corridorWidth"},doorClearWidth:{value:.9,unit:"m",source:"ADA 404.2.3 / Part M Table 2"},doorHardware:{value:"lever",source:"ADA 309.4 (no tight grasping)"},thresholdMax:{value:.013,unit:"m",source:"ADA 303.2"},handrailHeight:{value:.9,unit:"m",source:"ADA 505.4"}},dependsOn:["ARC-03"],references:["ADA Standards 2010","Approved Document M Vol 1","AS 1428.1"]},{id:"ARC-31",name:"Lobby Sequence",discipline:"architecture",problem:"Stepping straight from the footway into a lift creates no transition: you are still in public when you reach your door. Post, parcels, buggies and bikes then silt up wherever there is room.",solution:"Order the ground floor as a sequence: entrance recess → lobby with daylight and a place to stand → post and parcels → lift lobby → the door home. Bikes, refuse and plant are entered off the same lobby but from the back, never across it.",parameters:{lobbyArea:{value:40,unit:"m²",source:"default"},mailArea:{value:8,unit:"m²",source:"default (parcel lockers + boxes)"},entranceDoorWidth:{value:1.8,unit:"m",source:"SIZES.doorBuildingEntry (double leaf)"},sequenceSteps:{value:4,unit:"count",source:"entrance, lobby, mail, lift lobby"}},dependsOn:["ARC-04"],references:["Alexander, A Pattern Language #112 Entrance Transition, #130 Entrance Room"]},{id:"ARC-32",name:"Shafts Beside Cores",discipline:"architecture",problem:"Mechanical, electrical and refuse risers invented late in the design end up inside dwellings, so every floor is punctured in a different place and maintenance means entering someone's home.",solution:"Give every core a shaft bay immediately beside it, accessed from the corridor, holding one combined mechanical/electrical riser and (above three storeys) a refuse chute. The bay runs the full depth of the unit strip; whatever is left of it becomes resident storage.",parameters:{combinedShaft:{value:"1.2 x 0.8",unit:"m",source:"XD-04"},trashChute:{value:"1.0 x 1.0",unit:"m",source:"default (min 4 storeys)"},shaftWallThickness:{value:.15,unit:"m",source:"SIZES.shaftWallT"},shaftAreaPerUnitServed:{value:.12,unit:"m²/unit",source:"XD-04"},acc 0.2 / NBC 2020 §3.2.2"}},references:["IBC 2021 Table 504.4 and §510.2","NBC 2020 Div. B §3.2.2","ACI 318-19","IStructE Manual for the design of concrete building structures to Eurocode 2"]},{id:"STR-02",name:"Grid on Party Walls",discipline:"structure",problem:"A structural grid laid out for the structure alone lands columns in the middle of living rooms, breaks the unit rhythm and forces the architect to plan around lumps of concrete.",solution:"Lay the grid on lines architecture has already drawn: longitudinal lines on the two exterior wall centrelines and the two corridor wall centrelines (a single mid-depth line for houses and stair-core plans); transverse lines on the party wall centrelines. Merge transverse lines closer than the minimum spacing, and subdivide any bay longer than the economic span. Point plates take perimeter lines plus the core wall lines at the target spacing. Letters run along +X, numbers along +Y (I and O skipped, as in drafting practice).",parameters:{minSpacing:{value:4,unit:"m",source:"below this, two columns are cheaper merged into one"},maxSpacing:{value:9,unit:"m",source:"RC flat slab economic span (span/depth ≈ 30)"},targetSpacingPointPlate:{value:7.5,unit:"m",source:"default"},sourceWallTypes:{value:"exterior, party, corridor, core",source:"typology"}},dependsOn:["XD-03","ARC-02"],references:["XD-03 Structure Follows Party Walls","Eurocode 2 (EN 1992-1-1) §7.4 span/depth limits"]},{id:"STR-03",name:"Columns Hide in Walls",discipline:"structure",problem:"A column standing free in a dwelling is unusable area, an obstacle to furniture and a detail the builder has to case in. A column 300 mm off a party wall is the worst of both worlds.",solution:"Any grid intersection within the snap distance of an exterior, party, corridor or core wall centreline moves onto that centreline, so the column is absorbed into the wall zone and thickens only locally. Intersections that fall inside a stair, elevator or shaft footprint are dropped — the shear-wall core carries that area.",parameters:{snapDistance:{value:.6,unit:"m",source:"default (column half-width plus wall half-thickness)"},dropInsideCores:{value:!0,source:"STR-05"}},dependsOn:["STR-02"],references:["Alexander APL #205 Structure Follows Social Spaces"]},{id:"STR-04",name:"Podium Transfer Level",discipline:"structure",problem:"A parking or retail podium wants large clear bays, the dwellings above want a grid on the party walls, and the two grids never agree. Carrying the residential walls straight down would fill the podium with columns and make it unusable.",solution:"Run the podium on a parking module grid, run the dwellings above on the party-wall grid, and put one transfer level between them: a thickened slab at the first residential floor plus transfer beams under it, on the residential grid lines, spanning between podium columns. The transfer level is recorded as `transferStorey` so mechanical, plumbing and electrical know that storey has a deeper structural zone.",parameters:{parkingModuleAlongBar:{value:8.4,unit:"m",source:"three 2.6–2.8 m stalls per bay"},parkingModuleAcross:{value:16.8,unit:"m",source:"5.4 m stall + 6.0 m aisle + 5.4 m stall"},transferSlabThickness:{value:.3,unit:"m",source:"default"},transferBeamWidth:{value:.5,unit:"m",source:"default"},transferBeamDepth:{value:.9,unit:"m",source:"span/10 at a 9 m transfer span"}},dependsOn:["STR-02","XD-03"],references:["IBC 2021 §510.2","ACI 318-19 §18 (transfer of forces at discontinuities)"]},{id:"STR-05",name:"Core as Shear Spine",discipline:"structure",problem:"Wind and earthquake want a stiff element; dwellings want thin partitions and open corners. Bracing the perimeter blocks the views and the windows that are the whole point of housing.",solution:"The stair and elevator core is already a fire-rated, window-free box that runs the full height — make it the lateral system. Every core wall becomes a structural shear wall (LoadBearing, IFC predefined type SHEAR); no columns are placed inside the core footprint; above 20 storeys the party walls flanking the core are recruited as shear walls too, so the spine widens where drift governs.",parameters:{coreWallRole:{value:"shear",source:"default"},designShearWallThickness:{value:.3,unit:"m",source:"ACI 318-19 §18.10 (special structural walls)"},recruitFlankingPartyWallsAbove:{value:20,unit:"storeys",source:"drift-governed above roughly 20 storeys"},driftLimit:{value:.002,unit:"h (inter-storey)",source:"code:ASCE 7-22 Table 12.12-1 (serviceability target for residential)"}},dependsOn:["ARC-04"],references:["ACI 318-19 §18.10","ASCE 7-22 Ch. 12","EN 1998-1 §5.4"]},{id:"STR-06",name:"Foundation by Load and Ground",discipline:"structure",problem:"Foundations are invisible and therefore chosen late, which is when they are most expensive to change. The same pad footing appears under a bungalow and under a tower.",solution:"Derive the foundation from the load path above: bearing walls get strip footings (and a stem wall up to the ground slab); a column frame gets pad footings sized on the tributary load; a heavy or basement structure gets a raft; anything over 12 storeys, or with a basement under 8+ storeys, goes to bored piles with pile caps. Single-storey slab-on-grade keeps a thickened edge only. All footings are founded on one level: the underside sits on the `FND` storey datum.",parameters:{stripWidth:{value:.6,unit:"m",source:"default (bearing-wall strip on medium-dense soil)"},stripHeight:{value:.3,unit:"m",source:"default"},padSizeFormula:{value:"0.15 x storeys + 1.2, capped at 3.5",unit:"m square",source:"default"},padHeight:{value:.5,unit:"m",source:"default"},raftThickness:{value:.8,unit:"m",source:"default"},pileDiameter:{value:.6,unit:"m",source:"default (bored pile)"},pileLength:{value:18,unit:"m (25 m above 25 storeys)",source:"default"},pileCapSize:{value:1.8,unit:"m square",source:"default"},allowableBearingPressure:{value:150,unit:"kPa",source:"assumed medium-dense sand / stiff clay"}},dependsOn:["STR-01"],references:["ACI 318-19 §13","EN 1997-1 (Eurocode 7)","AS 2870","IBC 2021 Table 1806.2"]},{id:"STR-07",name:"Slab Openings Follow Shafts",discipline:"structure",problem:"Risers get cut through slabs on site, next to columns and through reinforcement, because nobody put the holes in the structural model.",solution:"Every stair flight, elevator shaft and MEP shaft that architecture declares on a storey becomes a rectangular opening in that storey structural slab, at the architectural rect. The lowest slab is left solid except for shafts that actually continue down, so no hole is cut for a stair or lift pit that stops there.",parameters:{openingSources:{value:"arch.stairs, arch.elevators, arch.shafts",source:"typology"},lowestSlabStairOpening:{value:!1,source:"only when a basement exists"}},dependsOn:["XD-04","ARC-04"],references:["ACI 318-19 §8.5.4 (openings in slab systems)"]},{id:"STR-08",name:"Headers over Openings",discipline:"structure",problem:"A wide window or a patio door in a bearing wall interrupts the load path; without a header the studs over the opening carry nothing and the trimmer studs are overloaded.",solution:"Every opening wider than the trigger width in a bearing wall receives a header (lintel) spanning the opening plus a bearing length each end, its underside just above the opening head, its width equal to the wall thickness. Narrower openings are covered by the standard trimmer detail and are not modelled.",parameters:{triggerWidth:{value:1.2,unit:"m",source:"default (below this, standard trimmer detail)"},bearingEachEnd:{value:.15,unit:"m",source:"code:NDS 2018 §3.10 bearing area"},headerDepth:{value:.2,unit:"m",source:"default (2-ply LVL / precast lintel)"},clearanceAboveOpening:{value:.05,unit:"m",source:"default"}},dependsOn:["STR-01"],references:["NDS 2018 §3.10","CSA O86-19","BS EN 845-2 (masonry lintels)"]},{id:"STR-09",name:"Economic Span",discipline:"structure",problem:"Spans chosen for architectural convenience alone either waste material (short spans, many columns) or blow the floor depth and the building height (long spans).",solution:"Keep bays inside the economic band for the material: 6–9 m for reinforced concrete flat slabs, 4–6 m for timber joist and CLT floors, 6–12 m for steel with secondary beams. A bay longer than the band is subdivided with an intermediate grid line; a bay shorter than the merge distance loses its line.",parameters:{rcSpanMin:{value:6,unit:"m",source:"RC flat slab economics"},rcSpanMax:{value:9,unit:"m",source:"span/depth 30 at 250–300 mm"},timberSpanMin:{value:4,unit:"m",source:"NDS / CSA O86 joist tables"},timberSpanMax:{value:6,unit:"m",source:"I-joist and 5-ply CLT residential spans"},steelSecondarySpacing:{value:3,unit:"m",source:"composite metal deck unshored span"}},dependsOn:["STR-02"],references:["ACI 318-19 Table 8.3.1.1","EN 1992-1-1 §7.4.2","NDS 2018 Supplement span tables","AISC Design Guide 3"]},{id:"STR-10",name:"Balanced Column Sizes",discipline:"structure",problem:"One column size repeated up a whole building is either oversized at the top or unsafe at the bottom, and a size chosen per column produces forty different formwork sizes.",solution:"Size each column from the load it actually carries: axial load N = (storeys above) x (dead + live) x tributary area, required area A = N / (0.3 f'c) for concrete, then round up to the nearest 50 mm and clamp to the system band. Columns on one storey therefore share a small family of sizes and the family steps as you go down.",parameters:{axialFormula:{value:"A = N / (0.3 x f'c), N = storeysAbove x (dead + live) x tributaryArea",source:"code:ACI 318-19 §22.4 (simplified axial capacity, low eccentricity)"},concreteStrength:{value:30,unit:"MPa (C30/37)",source:"default"},roundTo:{value:.05,unit:"m",source:"formwork module"},rcMinSide:{value:.4,unit:"m",source:"default"},rcMaxSide:{value:.9,unit:"m",source:"default"},steelBand:{value:"0.30-0.50 square HSS",unit:"m",source:"default"},timberPost:{valu
